function openMatchDetail(m){
  const A = teamById(m.teamAId), B = teamById(m.teamBId);
  const agg = matchAggregate(m);
  const mvp = m.mvpId ? playerById(m.mvpId) : null;
  const motm = m.motmId ? playerById(m.motmId) : null;
  const ps = m.playerStats || {};
  let html = `<div class="row" style="justify-content:center;gap:14px;margin-bottom:12px">
    ${teamLink(A, 40)}
    <b style="font-size:26px;color:var(--pl-purple)">${agg.a} - ${agg.b}</b>
    ${teamLink(B, 40)}
  </div>
  <div class="center muted small" style="margin-bottom:12px">
    ${new Date(m.timestamp||0).toLocaleString()} &nbsp;|&nbsp; ${agg.legs.length} leg${agg.legs.length > 1 ? 's' : ''}
  </div>
  <div class="row" style="justify-content:center;gap:8px;margin-bottom:8px">
    ${mvp ? `<span class="pill go">🏅 MVP: ${playerLink(mvp)}</span>` : (m.mvpSnapshot ? `<span class="pill go">🏅 MVP: <span class="muted">${esc(m.mvpSnapshot.name)} (deleted)</span></span>` : '')}
    ${motm ? `<span class="pill mg">⭐ MOTM: ${playerLink(motm)}</span>` : (m.motmSnapshot ? `<span class="pill mg">⭐ MOTM: <span class="muted">${esc(m.motmSnapshot.name)} (deleted)</span></span>` : '')}
  </div>`;
  const legTable = (tid, legIndex) => {
    const tm = teamById(tid);
    const rows = [];
    Object.keys(ps).forEach(pid => {
      const p = playerById(pid);
      const snapTeam = teamForMatch(m, pid);
      if (snapTeam !== tid) return;
      const arr = ps[pid];
      const l = arr && arr[legIndex];
      if (!l || !l.played) return;
      if (p) rows.push({ p, l });
      else rows.push({ p: { id: pid, name: '(deleted player)' }, l, ghost: true });
    });
    if (!rows.length) return `<div class="empty" style="padding:14px">No ${esc(tm.name)} players tracked</div>`;
    const score = l => (+l.goals||0)*5 + (+l.assists||0)*3 + (+l.saves||0) + (+l.tackles||0)*0.5;
    rows.sort((x,y) => score(y.l) - score(x.l));
    const tot = rows.reduce((t,r) => ({
      g: t.g + (+r.l.goals||0), a: t.a + (+r.l.assists||0),
      s: t.s + (+r.l.saves||0), k: t.k + (+r.l.tackles||0)
    }), { g:0, a:0, s:0, k:0 });
    return `<div class="tblwrap"><table style="min-width:420px">
      <thead><tr><th>${teamTag(tm, 20)}</th><th class="num">G</th><th class="num">A</th><th class="num">S</th><th class="num">T</th><th class="num">Grade</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td>${r.ghost ? `<span class="muted">${esc(r.p.name)}</span>` : playerLink(r.p)}</td>
          <td class="num">${+r.l.goals||0}</td>
          <td class="num">${+r.l.assists||0}</td>
          <td class="num">${+r.l.saves||0}</td>
          <td class="num">${+r.l.tackles||0}</td>
          <td class="num"><span class="rk rk-${legGrade(r.l)}">${legGrade(r.l)}</span></td>
        </tr>`).join('')}
        <tr class="leg-total">
          <td>Totals</td>
          <td class="num">${tot.g}</td><td class="num">${tot.a}</td><td class="num">${tot.s}</td><td class="num">${tot.k}</td><td></td>
        </tr>
      </tbody>
    </table></div>`;
  };
  agg.legs.forEach(l => {
    const i = l.n - 1;
    html += `<div class="leg-block">
      <div class="leg-head">
        <span class="pill cy">LEG ${l.n}</span>
        <b class="mono">${l.a} - ${l.b}</b>${(agg.penaltyA || agg.penaltyB) ? '<span class="tiny muted">(before match penalties)</span>' : ''}
        <span class="tiny muted">${l.a > l.b ? esc(A.name) + ' won the leg' : l.b > l.a ? esc(B.name) + ' won the leg' : 'Drawn leg'}</span>
      </div>
      ${legTable(A.id, i)}
      <div style="height:12px"></div>
      ${legTable(B.id, i)}
    </div>`;
  });
  const matchFouls = normalizeMatchFouls(m.fouls, m.teamAId, m.teamBId);
  html += `<div class="section-title" style="margin-top:20px">🚫 Fouls for this match</div>`;
  if (matchFouls.length){
    html += `<div class="tblwrap"><table><thead><tr><th>Foul</th><th>Team</th><th class="num">Score penalty</th></tr></thead><tbody>${matchFouls.map(f => {
      const offender = teamById(f.teamId);
      return `<tr><td>${esc(f.description)}</td><td>${offender ? teamTag(offender, 20) : '<span class="muted">Unknown team</span>'}</td><td class="num" style="color:#dc2626;font-weight:800">-${f.points}</td></tr>`;
    }).join('')}</tbody></table></div>
    <div class="hint" style="margin-top:8px">Raw aggregate: ${agg.rawA} - ${agg.rawB}. Applied penalties: ${agg.penaltyA ? `${esc(A.name)} -${agg.penaltyA}` : ''}${agg.penaltyA && agg.penaltyB ? ' • ' : ''}${agg.penaltyB ? `${esc(B.name)} -${agg.penaltyB}` : ''}. Final score: ${agg.a} - ${agg.b}.</div>`;
  } else html += '<div class="muted small">No fouls recorded for this match.</div>';
  openModal('📊 Match Details', html, `<button class="btn" data-act="modal:close">Close</button>`);
}

function marketDirectoryHTML(query, selectedId){
  const st = computePlayerStats();
  const q = String(query || '').trim().toLowerCase();
  const players = app.state.players.slice().sort((a,b) => String(a.name).localeCompare(String(b.name)));
  const filtered = players.filter(p => {
    const club = p.freeAgent ? 'free agent' : teamById(p.teamId).name;
    const loanFrom = p.loanStatus ? teamById(p.loanStatus.from).name : '';
    return !q || [p.name, club, loanFrom, p.id].join(' ').toLowerCase().includes(q);
  });
  if (!filtered.length) return '<div class="empty" style="padding:20px">No players match that search.</div>';
  return filtered.map(p => {
    const club = p.freeAgent ? 'Free Agent' : teamById(p.teamId).name;
    const value = st[p.id] ? st[p.id].playerValue : (p.startingValue || econ().playerStart);
    const status = p.loanStatus ? 'ON LOAN' : (p.freeAgent ? 'FREE AGENT' : 'ROSTER');
    const sub = p.loanStatus ? `Loaned from ${esc(teamById(p.loanStatus.from).name)}` : (p.freeAgent ? 'Available to sign' : 'Available for transfer or loan');
    return `<button type="button" class="market-player-row ${selectedId === p.id ? 'selected' : ''}" data-act="market:select" data-id="${esc(p.id)}">
      <span class="market-player-main"><b>${esc(p.name)}</b><small>${esc(club)} · ${sub}</small></span>
      <span class="market-player-value">${money(value)}</span>
      <span class="market-player-status ${p.loanStatus ? 'loan' : p.freeAgent ? 'free' : ''}">${status}</span>
    </button>`;
  }).join('');
}

    <div class="hint" style="margin-top:8px">Full transfers move the player's value immediately. Loans have no upfront charge: the borrowing team pays one share only when the player actually appears in a leg. Unplayed legs cost nothing, and the player automatically returns after ${duration} played legs unless you end the loan earlier.</div>

      <span id="marketCount" class="hint">${app.state.players.length} players in the directory</span>
      <span class="hint">Select any row to manage the player</span>
    </div>
    <div id="marketDirectory" class="market-directory">${marketDirectoryHTML(app._marketQuery, app._marketSelectedPlayerId)}</div>
    <div class="divider"></div>
    <div id="marketDealPanel">${marketDealPanelHTML(selected)}</div>`;
  openModal('💱 Transfer & Loan Center', html, '<button class="btn" data-act="modal:close">Close</button>');
}

function openAwardRanking(key){
  const { teamAwards, playerAwards } = buildAwards();
  const all = teamAwards.concat(playerAwards);
  const a = all.find(x => x.key === key);
  if (!a) return;
  const rows = (a.rows || []).slice(0, 400);
  const maxV = Math.max(...rows.map(r => Math.abs(r.value)), 1);
  const isPlayer = playerAwards.some(x => x.key === key);
  let html = `<div class="tiny muted" style="margin-bottom:14px">${esc(a.desc)}</div>`;
  if (!rows.length) html += `<div class="empty">No data yet</div>`;
  else {
    html += `<div class="tiny muted" style="margin-bottom:10px">${rows.length} entr${rows.length === 1 ? 'y' : 'ies'}, zeros included</div>`;
    html += `<div class="tblwrap"><table>
      <thead><tr><th>#</th><th>Name</th><th class="num">Value</th><th style="width:130px">Chart</th></tr></thead>
      <tbody>${rows.map((r,i) => `<tr class="${i < 3 ? 'top' + (i + 1) : ''}">
        <td><span class="rk ${i===0?'rank1':i===1?'rank2':i===2?'rank3':'rk-D'}">${i+1}</span></td>
        <td>${r.p2Id ? `${playerLink(playerById(r.id), r.color)} & ${playerLink(playerById(r.p2Id), r.color)}`
          : (isPlayer
            ? (playerById(r.id) ? playerLink(playerById(r.id), r.color) : esc(r.label))
            : (teamById(r.id) && app.state.teams.some(t => t.id === r.id) ? teamLink(teamById(r.id), 20) : esc(r.label)))}
          ${r.sub ? `<div class="tiny muted">${esc(r.sub)}</div>` : ''}</td>
        <td class="num" style="color:var(--pl-purple);font-weight:900">${r.fmt ? r.fmt(r.value) : num(r.value)}</td>
        <td><div class="bar" style="height:12px"><span style="width:${Math.max(2,(Math.abs(r.value)/maxV)*100)}%"></span></div></td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  }
  openModal(a.icon + ' ' + esc(a.title), html, `<button class="btn" data-act="modal:close">Close</button>`);
}

async function archiveSeason(){
  const st = computePlayerStats();
  const table = standingsSorted();
  const bd = ballonDor().slice(0, 5);
  const topPlayers = app.state.players.map(p => ({
    name: p.name, team: teamById(p.teamId).name,
    goals: st[p.id]?.goals || 0, assists: st[p.id]?.assists || 0,
    saves: st[p.id]?.saves || 0, tackles: st[p.id]?.tackles || 0,
    value: st[p.id]?.playerValue || 0
  })).sort((a,b) => (b.goals*5 + b.assists*3) - (a.goals*5 + a.assists*3)).slice(0, 25);
  const archive = {
    id: uuid(),
    leagueName: app.state.leagueName, seasonName: app.state.seasonName,
    archivedAt: Date.now(),
    champion: table[0] ? table[0].name : null,
    standings: table.map(r => ({ name: r.name, mp:r.mp, w:r.w, d:r.d, l:r.l, gf:r.gf, ga:r.ga, gd:r.gd, pts:r.pts, value:r.value })),
    topPlayers,
    ballonTop5: bd.map(r => ({ name: r.player.name, team: teamById(r.player.teamId).name, pts: Math.round(r.pts) })),
    goldenBoot: topPlayers[0] ? topPlayers[0].name : null,
    matchCount: app.state.matches.length, playerCount: app.state.players.length
  };
  app.state.archives.push(archive);
  const E = econ();
  app.state.matches = [];
  app.state.fixtures = [];
  app.state.tournaments = [];
  app.state.teams.forEach(t => t.value = E.teamStart);
  app.state.players.forEach(p => { p.startingValue = E.playerStart; p.loanStatus = null; p.transferHistory = []; });
  app.state.hypeCycleId = uuid();
  resetHypeForNewCycle();
  await logAdmin('Archived season "' + archive.seasonName + '"');
  await saveState(); render();
  toast('📦 Season archived & reset', 'ok');
}

// Render local content immediately; Firebase connects in the background.
(async function boot(){
  try {
    loadLocal();
    loadHype();
    app._pendingCloudSave = hasPendingCloudSave();
    render();
    setCloudBadge('⏳ CONNECTING', false);

    const firebaseReady = await initDatabase();
    if (!firebaseReady) {
      setCloudBadge('⚠️ FIREBASE OFFLINE • LOCAL MODE', false);
      render();
      console.warn('Firebase unavailable; local browser storage remains active.');
      return;
    }

    let resolveInitialAuth;
    const initialAuth = new Promise(resolve => { resolveInitialAuth = resolve; });
    authUnsubscribe = firebaseApi.onAuthStateChanged(authClient, async user => {
      try {
        const wasAdmin = app.isAdmin;
        if (isAuthorizedAdminUser(user)) {
          app.user = { uid: user.uid };
          app.isAdmin = true;
          loadHypedPlayerIds();
          if (!wasAdmin) {
            const foundCloudData = await loadCloudState();
            if (!foundCloudData && !hasPendingCloudSave()) await saveState();
          }
        } else {
          app.user = null;
          app.isAdmin = false;
          loadHypedPlayerIds();
          if (user && !user.isAnonymous) {
            await firebaseApi.signOut(authClient);
          } else if (!user) {
            try { await firebaseApi.signInAnonymously(authClient); }
            catch(anonError) {
              console.warn('Anonymous Firebase sign-in unavailable:', anonError);
              setCloudBadge('⚠️ READER AUTH UNAVAILABLE', false);
            }
          } else if (wasAdmin) {
            setCloudBadge('🔒 ADMIN SIGNED OUT', false);
          }
        }
        watchCloudState();
        watchHypeCounts();
        render();
      } catch(authError) {
        console.error('Firebase auth state handling failed:', authError);
        setCloudBadge('⚠️ AUTH ERROR', false);
        toast('Firebase authentication could not finish. Check the Firebase Auth providers and connection.', 'err');
      } finally {
        if (!initialAuthResolved) {
          initialAuthResolved = true;
          resolveInitialAuth();
        }
      }
    }, authError => {
      console.error('Firebase auth listener failed:', authError);
      setCloudBadge('⚠️ AUTH ERROR', false);
      if (!initialAuthResolved) {
        initialAuthResolved = true;
        resolveInitialAuth();
      }
    });

    await initialAuth;
    if (!app.isAdmin && !authClient.currentUser) {
      setCloudBadge('⚠️ READER AUTH UNAVAILABLE', false);
    }
    render();
    console.log('%c👑 Unmatched Premier League ready', 'color:#e90052;font-weight:900');
  } catch(bootError) {
    console.error('League startup failed:', bootError);
    setCloudBadge('⚠️ STARTUP ERROR • LOCAL MODE', false);
    try { render(); } catch(renderError) { console.error('Fallback render failed:', renderError); }
    toast('The league opened in local mode because startup hit an error. Your browser backup was preserved.', 'err');
  }
})();
window.addEventListener('beforeunload', stopCloudListeners, { once: true });
</script>
