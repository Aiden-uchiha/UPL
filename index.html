<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<title>Unmatched Premier League</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<style>
:root{
  /* Premier League brand */
  --pl-purple:#38003c;
  --pl-purple-dark:#2a0030;
  --pl-purple-mid:#4a0a4e;
  --pl-purple-light:#f3e8f5;
  --pl-purple-wash:#faf5fc;
  --pl-pink:#e90052;
  --pl-pink-light:#fde8f0;
  --pl-cyan:#04f5ff;
  --pl-cyan-light:#e0fdff;
  --pl-green:#00ff87;
  --pl-green-light:#e0fff0;
  --pl-gold:#ffb81c;
  --pl-gold-light:#fff5e0;

  /* Neutrals */
  --bg:#ffffff;
  --bg-subtle:#f7f7fa;
  --bg-tint:#faf5fc;
  --ink:#1a0033;
  --ink-2:#38003c;
  --dim:#8a8a9a;
  --line:#e8e8ef;
  --line-2:#d8d8e0;

  /* JS compatibility aliases (readable on white) */
  --txt:var(--ink);
  --panel:#ffffff;
  --cyan:#0891b2;
  --magenta:var(--pl-pink);
  --lime:#059669;
  --gold:#b45309;
  --red:#dc2626;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:'Inter','Segoe UI',Roboto,system-ui,-apple-system,'Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--ink);overflow-x:hidden;
  font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum"
}
body::before{
  content:'';position:fixed;top:0;left:0;right:0;height:640px;z-index:-2;
  pointer-events:none;
  background:
    radial-gradient(ellipse 85% 100% at 50% 0%, rgba(56,0,60,.09), transparent 62%),
    radial-gradient(ellipse 55% 70% at 12% 0%, rgba(233,0,82,.06), transparent 60%),
    radial-gradient(ellipse 55% 70% at 88% 0%, rgba(4,245,255,.045), transparent 60%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(circle, rgba(56,0,60,.035) 1px, transparent 1px);
  background-size:22px 22px;
  mask-image:linear-gradient(180deg,#000 0%,transparent 55%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 55%);
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-subtle)}
::-webkit-scrollbar-thumb{background:var(--pl-purple);border-radius:10px;border:2px solid var(--bg-subtle)}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px 100px}

/* ============ HEADER ============ */
header.top{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(135deg,var(--pl-purple-dark) 0%,var(--pl-purple) 55%,var(--pl-purple-mid) 100%);
  box-shadow:0 2px 18px rgba(56,0,60,.22);
}
.brandbar{display:flex;align-items:center;gap:14px;padding:16px 0 12px;flex-wrap:wrap}
.brand{
  font-weight:900;font-size:21px;letter-spacing:.5px;text-transform:uppercase;
  color:#ffffff;cursor:pointer;user-select:none;white-space:nowrap;
  display:flex;align-items:center;gap:8px;
}
.brand .ball{
  display:inline-block;animation:spinball 8s linear infinite;
  color:#ffd43b !important;-webkit-text-fill-color:#ffd43b !important;
}
@keyframes spinball{to{transform:rotate(360deg)}}
.season-chip{
  font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.75);
  border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:6px;
  background:rgba(255,255,255,.06);font-weight:700;
}
.spacer{flex:1}
.cloud-badge{
  font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
  padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.8);background:rgba(255,255,255,.06);font-weight:700;
}
.cloud-badge.on{color:var(--pl-green);border-color:rgba(0,255,135,.5);background:rgba(0,255,135,.12)}
.cloud-badge.off{color:var(--pl-gold);border-color:rgba(255,180,0,.4);background:rgba(255,180,0,.12)}

/* Nav — light pills below header */
nav.nav{
  display:flex;gap:6px;padding:12px 0 14px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
nav.nav::-webkit-scrollbar{display:none}
.navbtn{
  flex:0 0 auto;cursor:pointer;border:1px solid var(--line);background:#ffffff;
  color:var(--ink);padding:9px 16px;font-size:11px;font-weight:800;
  letter-spacing:.6px;text-transform:uppercase;border-radius:8px;
  transition:all .18s ease;white-space:nowrap;display:flex;align-items:center;gap:6px;
  font-family:inherit;box-shadow:0 1px 2px rgba(56,0,60,.04);
}
.navbtn:hover{
  background:var(--pl-purple-light);border-color:var(--pl-purple);color:var(--pl-purple);
  transform:translateY(-1px);box-shadow:0 4px 12px rgba(56,0,60,.1);
}
.navbtn:active{transform:scale(.96)}
.navbtn.active{
  background:var(--pl-purple);color:#ffffff;border-color:var(--pl-purple);
  font-weight:900;box-shadow:0 4px 12px rgba(56,0,60,.22);
}
.navbtn.ghost{background:var(--pl-pink-light);border-color:rgba(233,0,82,.3);color:var(--pl-pink)}
.navbtn.ghost:hover{background:var(--pl-pink);color:#ffffff;border-color:var(--pl-pink)}
.navbtn.admin{background:var(--pl-gold-light);border-color:rgba(255,180,0,.4);color:#996a00}
.navbtn.admin.active{background:var(--pl-gold);color:var(--pl-purple);border-color:var(--pl-gold)}

/* ============ TYPOGRAPHY ============ */
h2,h3,h4{text-transform:uppercase;letter-spacing:1.5px;margin:0;font-weight:900}
.view-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:28px 0 20px;margin-bottom:8px;position:relative;
}
.view-head::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--pl-purple),var(--pl-pink),transparent);
  border-radius:2px;
}
.view-head h2{
  font-size:26px;color:var(--pl-purple);letter-spacing:.5px;text-shadow:none;font-weight:900;
}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.section-title{
  font-size:13px;letter-spacing:2.2px;text-transform:uppercase;
  color:var(--pl-purple);margin:26px 0 12px;display:flex;align-items:center;gap:10px;font-weight:900;
}
.section-title::before{
  content:'';display:inline-block;width:4px;height:18px;border-radius:2px;
  background:linear-gradient(180deg,var(--pl-purple),var(--pl-pink));flex:0 0 auto;
}
.section-title::after{
  content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent);
}
.muted{color:var(--dim)}
.small{font-size:12px}
.tiny{font-size:11px}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.center{text-align:center}
.nowrap{white-space:nowrap}

/* ============ BUTTONS ============ */
.btn{
  cursor:pointer;border:1.5px solid var(--line-2);background:#ffffff;color:var(--ink);
  padding:10px 18px;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  border-radius:8px;transition:all .18s ease;display:inline-flex;align-items:center;gap:6px;
  font-family:inherit;white-space:nowrap;box-shadow:0 1px 2px rgba(56,0,60,.04);
}
.btn:hover{
  background:var(--pl-purple);color:#ffffff;border-color:var(--pl-purple);
  transform:translateY(-1px);box-shadow:0 4px 14px rgba(56,0,60,.18);
}
.btn:active{transform:scale(.96)}
.btn.magenta{background:var(--pl-pink);color:#ffffff;border-color:var(--pl-pink)}
.btn.magenta:hover{background:#c70045;border-color:#c70045;box-shadow:0 4px 14px rgba(233,0,82,.3)}
.btn.gold{background:var(--pl-gold);color:var(--pl-purple);border-color:var(--pl-gold)}
.btn.gold:hover{background:#ffc947;border-color:#ffc947;color:var(--pl-purple)}
.btn.lime{background:var(--pl-green);color:var(--pl-purple);border-color:var(--pl-green)}
.btn.lime:hover{background:#00dd70;border-color:#00dd70;color:var(--pl-purple)}
.btn.danger{background:#ef4444;color:#ffffff;border-color:#ef4444}
.btn.danger:hover{background:#dc2626;border-color:#dc2626}
.btn.sm{padding:6px 12px;font-size:10px;letter-spacing:.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* ============ CARDS ============ */
.card{
  background:#ffffff;border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;transition:all .2s ease;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(56,0,60,.04);
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--pl-purple),var(--pl-pink),var(--pl-cyan));
}
.card:hover{
  border-color:var(--pl-purple);box-shadow:0 8px 24px rgba(56,0,60,.1);transform:translateY(-2px);
}
.card.clickable{cursor:pointer}

.grid{display:grid;gap:14px}
.grid.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.grid.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid.g4{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Logos */
.tdot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 auto}
.tlogo{
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:26px;height:26px;border-radius:6px;overflow:hidden;line-height:1;
  border:1px solid var(--line);background:var(--bg-subtle);
  font-size:14px;font-weight:900;
}
.tlogo img{width:100%;height:100%;object-fit:cover;display:block}
.tlogo.lg{border-radius:10px}
.tlogo.sm{width:20px;height:20px;font-size:11px;border-radius:5px}
.cl-name{
  cursor:pointer;transition:color .15s ease,border-color .15s ease;
  border-bottom:1px dotted transparent;
}
.cl-name:hover{color:var(--pl-purple);border-bottom-color:var(--pl-purple)}
.itag{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;max-width:100%}
.itag>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Grade tiles */
.grade-tile{
  border:1px solid var(--line);border-radius:12px;padding:16px;
  background:#ffffff;transition:all .2s ease;box-shadow:0 1px 2px rgba(56,0,60,.04);
}
.grade-tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(56,0,60,.1)}
.grade-tile h4{
  font-size:12px;letter-spacing:2.2px;display:flex;align-items:center;gap:8px;
  margin-bottom:10px;color:var(--ink);
}
.grade-tile ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.95;color:var(--dim)}
.grade-tile .gc-note{font-size:12.5px;color:var(--dim);line-height:1.7}
.grade-tile.gS{border-top:4px solid var(--pl-gold)}
.grade-tile.gA{border-top:4px solid var(--pl-cyan)}
.grade-tile.gB{border-top:4px solid var(--pl-green)}
.grade-tile.gC{border-top:4px solid var(--line-2)}

/* Tables */
.tblwrap{
  overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;
  border:1px solid var(--line);background:#ffffff;
  box-shadow:0 1px 2px rgba(56,0,60,.04);
}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
th{
  text-align:left;padding:12px 10px;font-size:10.5px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--pl-purple);background:var(--pl-purple-light);
  white-space:nowrap;border-bottom:1px solid var(--line);font-weight:900;
  position:sticky;top:0;z-index:2;
}
td{padding:11px 10px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap}
tbody tr:nth-child(even){background:var(--bg-subtle)}
tbody tr:hover{background:var(--pl-purple-light)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* Badges / pills */
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 7px;border-radius:5px;
  font-size:10.5px;font-weight:900;letter-spacing:.5px;
}
.b-W{background:var(--pl-green-light);color:#00a85a;border:1px solid rgba(0,255,135,.4)}
.b-D{background:var(--pl-gold-light);color:#996a00;border:1px solid rgba(255,180,0,.4)}
.b-L{background:var(--pl-pink-light);color:var(--pl-pink);border:1px solid rgba(233,0,82,.4)}

.rk{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:6px;font-weight:900;font-size:12px;
}
.rk-S{background:var(--pl-gold);color:var(--pl-purple)}
.rk-A{background:var(--pl-cyan);color:var(--pl-purple)}
.rk-B{background:var(--pl-green);color:var(--pl-purple)}
.rk-C{background:var(--line-2);color:var(--ink)}
.rk-D{background:var(--bg-subtle);color:var(--dim)}
.rank1{background:linear-gradient(135deg,#ffd43b,#ff9500);color:#1a1200}
.rank2{background:linear-gradient(135deg,#dfe7ff,#8d9bbd);color:#1a0033}
.rank3{background:linear-gradient(135deg,#ff9d5c,#b35a1f);color:#ffffff}

.pill{
  display:inline-block;padding:4px 10px;border-radius:6px;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;font-weight:800;
  border:1px solid var(--line);background:var(--bg-subtle);color:var(--dim);
}
.pill.cy{background:var(--pl-cyan-light);color:#007a85;border-color:rgba(4,245,255,.4)}
.pill.mg{background:var(--pl-pink-light);color:var(--pl-pink);border-color:rgba(233,0,82,.3)}
.pill.li{background:var(--pl-green-light);color:#00a85a;border-color:rgba(0,255,135,.4)}
.pill.go{background:var(--pl-gold-light);color:#996a00;border-color:rgba(255,180,0,.4)}

/* Bar */
.bar{height:22px;border-radius:6px;position:relative;overflow:hidden;background:var(--bg-subtle);min-width:60px}
.bar>span{
  display:block;height:100%;border-radius:6px;
  background:linear-gradient(90deg,var(--pl-purple),var(--pl-pink));
  transition:width .8s cubic-bezier(.2,.8,.3,1);
}

/* Forms */
input,select,textarea{
  width:100%;background:#ffffff;border:1.5px solid var(--line-2);color:var(--ink);
  padding:10px 12px;border-radius:8px;font-family:inherit;font-size:13.5px;
  outline:none;transition:all .16s;
}
input:focus,select:focus,textarea:focus{border-color:var(--pl-purple);box-shadow:0 0 0 3px rgba(56,0,60,.08)}
input[type=checkbox]{width:auto;accent-color:var(--pl-purple);transform:scale(1.2);cursor:pointer}
label.fl{
  display:block;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--ink);margin:10px 0 4px;font-weight:800;
}
.field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* Modal */
#modalRoot{position:fixed;inset:0;z-index:200;display:none}
#modalRoot.open{display:block}
.modal-back{
  position:absolute;inset:0;background:rgba(26,0,51,.7);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:880px;margin:auto;background:#ffffff;border-radius:16px;
  box-shadow:0 24px 80px rgba(56,0,60,.3),0 0 0 1px rgba(56,0,60,.08);
  animation:popIn .24s cubic-bezier(.2,.9,.3,1.2);overflow:hidden;
}
@keyframes popIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.modal-head{
  display:flex;align-items:center;gap:10px;padding:18px 20px;
  background:linear-gradient(135deg,var(--pl-purple),var(--pl-purple-mid));
  color:#ffffff;
}
.modal-head h3{font-size:14px;flex:1;color:#ffffff;letter-spacing:1.5px;font-weight:900}
.modal-head .x{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  color:#ffffff;width:32px;height:32px;border-radius:8px;cursor:pointer;
  font-size:15px;font-weight:900;transition:all .16s;flex:0 0 auto;
}
.modal-head .x:hover{background:rgba(255,255,255,.25)}
.modal-body{
  padding:20px;background:#ffffff;max-height:calc(100vh - 150px);overflow-y:auto;color:var(--ink);
}
.modal-foot{
  padding:14px 20px;border-top:1px solid var(--line);
  display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;background:var(--bg-subtle);
}

/* Toasts */
#toastRoot{
  position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:9px;
  pointer-events:none;max-width:calc(100vw - 32px);
}
.toast{
  background:#ffffff;border:1px solid var(--line);border-left:4px solid var(--pl-purple);
  padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink);
  box-shadow:0 8px 24px rgba(56,0,60,.15);
  animation:slideIn .3s cubic-bezier(.2,.9,.3,1.2);pointer-events:auto;
}
.toast.err{border-left-color:#ef4444}
.toast.ok{border-left-color:var(--pl-green)}
@keyframes slideIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}

/* Emoji animations */
.emoji{display:inline-block;transition:transform .25s cubic-bezier(.2,.9,.3,1.4);will-change:transform}
.btn:hover .emoji,.navbtn:hover .emoji,.card:hover .emoji{transform:translateY(-3px) scale(1.22) rotate(-8deg)}
.emoji.float{animation:floaty 2.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.emoji.wig{animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1.6)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* Empty */
.empty{
  text-align:center;padding:44px 16px;color:var(--dim);
  border:2px dashed var(--line-2);border-radius:14px;background:var(--bg-subtle);
}
.empty .big{font-size:44px;display:block;margin-bottom:12px;animation:floaty 3s ease-in-out infinite}

/* Key-value & stats */
.kv{
  display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line);font-size:13px;
}
.kv:last-child{border-bottom:none}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:800}
.kv>span:first-child{color:var(--dim);font-weight:600}

.statbox{
  background:#ffffff;border:1px solid var(--line);border-radius:12px;
  padding:16px 12px;text-align:center;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(56,0,60,.04);
}
.statbox::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--pl-purple),var(--pl-cyan));
}
.statbox .v{
  font-size:22px;font-weight:900;color:var(--pl-purple);
  font-variant-numeric:tabular-nums;line-height:1.2;
}
.statbox .l{
  font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--dim);margin-top:4px;font-weight:700;
}

.divider{height:1px;background:var(--line);margin:18px 0}

.legtab{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.legtab button{
  cursor:pointer;border:1.5px solid var(--line-2);background:#ffffff;color:var(--ink);
  padding:7px 14px;font-size:11px;font-weight:800;letter-spacing:.8px;border-radius:8px;
  text-transform:uppercase;transition:all .16s;font-family:inherit;
}
.legtab button.on{
  background:var(--pl-purple);color:#ffffff;border-color:var(--pl-purple);
  box-shadow:0 2px 8px rgba(56,0,60,.18);
}
.legtab button:hover:not(.on){background:var(--pl-purple-light);border-color:var(--pl-purple)}

.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hint{font-size:11.5px;color:var(--dim);line-height:1.7;font-weight:500}
.warnbox{
  border:1px solid rgba(255,180,0,.35);background:var(--pl-gold-light);
  border-radius:10px;padding:12px 14px;font-size:12.5px;color:#7a5300;font-weight:600;
}

/* Knockout */
.kobracket{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.kocol{min-width:190px;display:flex;flex-direction:column;gap:10px}
.ko-tie{
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  background:#ffffff;font-size:12.5px;box-shadow:0 1px 2px rgba(56,0,60,.04);
}
.ko-tie .tm{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.ko-tie .tm.win{color:var(--pl-purple);font-weight:800}

/* Match cards */
.match-card{
  background:#ffffff;border:1px solid var(--line);border-radius:14px;padding:16px;
  position:relative;overflow:hidden;transition:all .2s ease;display:flex;flex-direction:column;
  box-shadow:0 1px 2px rgba(56,0,60,.04);
}
.match-card:hover{
  border-color:var(--pl-purple);box-shadow:0 8px 24px rgba(56,0,60,.1);transform:translateY(-2px);
}
.mc-header{
  display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--dim);
  text-transform:uppercase;letter-spacing:1.2px;margin-bottom:12px;padding-bottom:10px;
  border-bottom:1px solid var(--line);font-weight:800;
}
.mc-body{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mc-team{
  flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;
  font-weight:800;font-size:13px;line-height:1.2;color:var(--ink);
}
.mc-team.cl-side{cursor:pointer}
.mc-team.cl-side:hover .cl-name{color:var(--pl-purple)}
.mc-score{
  font-size:24px;font-weight:900;color:var(--pl-purple);background:var(--pl-purple-light);
  padding:6px 20px;border-radius:10px;min-width:80px;text-align:center;
  font-variant-numeric:tabular-nums;
}
.mc-footer{
  display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  padding-top:10px;border-top:1px solid var(--line);font-size:11px;gap:8px;
}
.mc-legs{
  font-size:10.5px;color:var(--dim);text-align:center;margin-top:8px;letter-spacing:.5px;
  background:var(--bg-subtle);padding:5px;border-radius:6px;font-weight:600;
}

/* Award sweep */
@keyframes awSweep{0%{transform:rotate(18deg) translateX(-140%)}55%,100%{transform:rotate(18deg) translateX(140%)}}
.aw-card{position:relative;overflow:hidden}
.aw-card::after{
  content:'';position:absolute;top:-60%;left:-40%;width:45%;height:220%;
  background:linear-gradient(90deg,transparent,rgba(56,0,60,.07),transparent);
  transform:rotate(18deg) translateX(-140%);animation:awSweep 5s ease-in-out infinite;
  pointer-events:none;
}
.aw-card:hover::after{animation-duration:1.5s}

/* Top rows */
@keyframes rowShine{0%{background-position:-140% 0}100%{background-position:240% 0}}
tbody tr.top1,tbody tr.top2,tbody tr.top3{background-size:260% 100%}
tbody tr.top1 td,tbody tr.top2 td,tbody tr.top3 td{font-weight:800;color:var(--ink)}
tbody tr.top1{background-image:linear-gradient(100deg,rgba(255,180,28,.18) 0%,#ffffff 45%,rgba(255,180,28,.18) 70%);animation:rowShine 7s linear infinite}
tbody tr.top2{background-image:linear-gradient(100deg,rgba(56,0,60,.07) 0%,#ffffff 45%,rgba(56,0,60,.07) 70%);animation:rowShine 8s linear infinite}
tbody tr.top3{background-image:linear-gradient(100deg,rgba(0,255,135,.1) 0%,#ffffff 45%,rgba(0,255,135,.1) 70%);animation:rowShine 9s linear infinite}
tbody tr.top1:hover,tbody tr.top2:hover,tbody tr.top3:hover{background:var(--pl-purple-light)!important}

/* Report preview */
.rp-match{
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;
  background:var(--bg-subtle);
}

/* Tracker */
.trk-score{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 14px;flex-wrap:wrap}
.trk-side{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-align:center;min-width:90px}
.trk-side b{font-weight:800;color:var(--ink)}
.trk-num{
  font-size:32px;font-weight:900;color:var(--pl-purple);font-variant-numeric:tabular-nums;
  letter-spacing:.5px;
}
.trk-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.trk-cols{grid-template-columns:1fr}}
.trk-team-head{
  display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--pl-purple);margin-bottom:8px;font-weight:900;
}
.trk-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
.trk-name{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:700;font-size:13px;transition:opacity .15s ease;color:var(--ink);
}
.trk-name.out{opacity:.6}
.trk-play{display:flex;align-items:center;flex:0 0 auto;margin:0;cursor:pointer}
.trk-play input{width:15px;height:15px;margin:0;transform:scale(1.1);cursor:pointer}
.trk-mini{
  margin-left:6px;cursor:pointer;font-family:inherit;border:1px solid var(--line-2);
  background:#ffffff;color:var(--dim);border-radius:5px;padding:2px 8px;
  font-size:9.5px;letter-spacing:1px;text-transform:uppercase;font-weight:800;
}
.trk-mini:hover{color:var(--pl-purple);border-color:var(--pl-purple)}
.trk-chip{
  cursor:pointer;flex:0 0 auto;min-width:48px;border:1.5px solid var(--line-2);
  background:#ffffff;color:var(--ink);border-radius:7px;padding:5px 6px;
  font-size:11.5px;font-weight:800;font-family:inherit;transition:all .12s ease;
}
.trk-chip:hover{background:var(--pl-purple-light);transform:translateY(-1px)}
.trk-chip:active{transform:scale(.94)}
.trk-chip.on{
  color:var(--pl-purple);border-color:var(--pl-purple);background:var(--pl-purple-light);
  font-weight:900;
}
.trk-chip.off{opacity:.3;pointer-events:none}

.leg-block{
  margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;
  background:#ffffff;box-shadow:0 1px 2px rgba(56,0,60,.04);
}
.leg-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.leg-head b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.leg-head .pill{flex:0 0 auto}
tr.leg-total td{
  font-weight:900;color:var(--pl-purple);background:var(--pl-purple-light);
  border-top:2px solid var(--pl-purple);
}

/* Team of the season */
.tos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.tos-card{
  position:relative;overflow:hidden;text-align:center;border:1px solid var(--line);
  border-radius:14px;padding:20px 14px 16px;
  background:linear-gradient(180deg,#ffffff,var(--bg-subtle));
  transition:transform .2s ease,box-shadow .2s ease;box-shadow:0 1px 2px rgba(56,0,60,.04);
}
.tos-card::before{
  content:'';position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--pl-purple),var(--pl-gold),var(--pl-pink));
}
.tos-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(56,0,60,.12)}
.tos-top{
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:10.5px;
  letter-spacing:2.4px;text-transform:uppercase;color:var(--pl-purple);font-weight:900;
}
.tos-icon{font-size:18px;letter-spacing:0}
.tos-name{margin-top:12px;font-size:16px;font-weight:900;color:var(--ink);line-height:1.25}
.tos-team{margin-top:5px;font-size:11.5px;color:var(--dim);display:flex;justify-content:center;font-weight:600}
.tos-stat{
  margin-top:12px;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--dim);font-weight:700;
}
.tos-stat b{display:block;font-size:22px;color:var(--pl-purple);letter-spacing:0;font-weight:900}
.tos-card.empty{opacity:.55}

.award-custom-icon{
  display:inline-block;width:25px;height:25px;object-fit:contain;vertical-align:middle;
}

/* Ballon d'Or */
.bd-live{
  margin:12px 0 24px;padding:24px;border:2px solid var(--pl-gold);border-radius:16px;
  background:linear-gradient(135deg,#fffbf0 0%,#faf0ff 100%);overflow:hidden;position:relative;
}
.bd-live-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bd-live-top>div{
  display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:2.5px;
  color:var(--pl-purple);font-size:14px;
}
.bd-live-top .award-custom-icon{width:32px;height:32px}
.bd-live-tag{
  border:1px solid rgba(56,0,60,.2);border-radius:30px;padding:5px 10px;
  color:var(--pl-purple);background:#ffffff;font-size:9px;font-weight:900;letter-spacing:1.5px;
}
.bd-live-sub{color:var(--dim);font-size:12px;margin:8px 0 20px;font-weight:600}
.bd-podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;padding:8px 2px 0}
.bd-podium-card{
  position:relative;min-width:0;min-height:200px;padding:18px 12px 14px;text-align:center;
  border:1px solid var(--line);border-radius:14px 14px 6px 6px;background:#ffffff;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;
  overflow:hidden;box-shadow:0 2px 8px rgba(56,0,60,.06);
}
.bd-rank-1{
  min-height:230px;border-color:var(--pl-gold);
  background:linear-gradient(180deg,#fff8e0,#ffffff);transform:translateY(-12px);
  box-shadow:0 8px 28px rgba(255,180,0,.2);
}
.bd-rank-2{border-color:#c0d0e0}
.bd-rank-3{border-color:#d8b89c}
.bd-medal{font-size:24px;line-height:1}
.bd-avatar{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  border:2px solid var(--pl-gold);background:linear-gradient(135deg,var(--pl-purple),var(--pl-pink));
  color:#ffffff;font-size:14px;font-weight:900;letter-spacing:1px;
}
.bd-rank-1 .bd-avatar{width:54px;height:54px;font-size:17px;box-shadow:0 4px 16px rgba(255,180,0,.3)}
.bd-rank-label{font-size:8px;letter-spacing:2px;font-weight:900;color:var(--pl-purple)}
.bd-player-name{
  max-width:100%;font-size:13px;font-weight:900;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bd-player-team{font-size:10px;color:var(--dim);max-width:100%;overflow:hidden;font-weight:600}
.bd-points{
  font-size:22px;font-weight:900;line-height:1.1;color:var(--pl-purple);
  font-variant-numeric:tabular-nums;
}
.bd-points small{display:block;font-size:8px;letter-spacing:2px;color:var(--dim);margin-top:3px;font-weight:700}
.bd-breakdown{font-size:9px;color:var(--dim);white-space:nowrap;font-weight:600}
.bd-empty{color:var(--dim);font-size:10px;margin-top:20px}
.bd-live-footer{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding-top:14px;margin-top:16px;border-top:1px solid rgba(56,0,60,.1);
  font-size:11px;color:var(--dim);font-weight:600;
}
@media (max-width:640px){
  .bd-podium{gap:6px}
  .bd-podium-card{min-height:175px;padding:12px 5px 9px}
  .bd-rank-1{min-height:199px;transform:translateY(-7px)}
  .bd-player-name{font-size:11px}
  .bd-points{font-size:18px}
  .bd-breakdown{font-size:8px}
  .bd-avatar{width:38px;height:38px}
  .bd-live-footer{align-items:flex-start;flex-direction:column}
}

/* Hype */
.hype-panel{
  margin:14px 0;padding:16px;border:1px solid rgba(233,0,82,.2);border-radius:14px;
  background:linear-gradient(135deg,var(--pl-pink-light),var(--pl-purple-light));
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.hype-panel-copy{display:flex;flex-direction:column;gap:4px;flex:1;min-width:180px}
.hype-panel-copy b{font-size:14px;color:var(--pl-pink);font-weight:900}
.hype-panel-copy span{font-size:11px;line-height:1.55;color:var(--dim);font-weight:600}
.hype-panel-action{display:flex;align-items:center;gap:12px}
.hype-total{text-align:center;min-width:56px}
.hype-total b{display:block;font-size:22px;color:var(--pl-purple);font-variant-numeric:tabular-nums;font-weight:900}
.hype-total small{font-size:8px;letter-spacing:1.5px;color:var(--dim);font-weight:700}
.hype-fire{
  border:1.5px solid var(--pl-pink);background:var(--pl-pink);color:#ffffff;font-weight:900;
  box-shadow:0 4px 16px rgba(233,0,82,.25);
}
.hype-fire:hover:not(:disabled){
  background:#c70045;border-color:#c70045;transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(233,0,82,.35);
}
.hype-fire:disabled{opacity:.5;cursor:not-allowed}
.hype-help{flex-basis:100%;font-size:10px;color:var(--dim);margin-top:-4px;font-weight:600}
@media (max-width:640px){.hype-panel-action{width:100%;justify-content:space-between}}

/* Market */
.market-directory{
  max-height:320px;overflow-y:auto;display:grid;gap:6px;padding:6px;
  border:1px solid var(--line);border-radius:10px;background:var(--bg-subtle);
}
.market-player-row{
  width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;
  align-items:center;gap:12px;text-align:left;padding:10px 12px;
  border:1px solid var(--line);border-radius:8px;background:#ffffff;color:var(--ink);
  cursor:pointer;font:inherit;transition:all .14s;
}
.market-player-row:hover,.market-player-row.selected{
  border-color:var(--pl-purple);background:var(--pl-purple-light);
  box-shadow:0 2px 8px rgba(56,0,60,.08);
}
.market-player-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.market-player-main b{
  font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.market-player-main small{
  font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-weight:600;
}
.market-player-value{font-size:11px;font-weight:900;color:var(--pl-purple);white-space:nowrap}
.market-player-status{font-size:9px;font-weight:900;letter-spacing:1px;color:#007a85;white-space:nowrap}
.market-player-status.loan{color:#996a00}
.market-player-status.free{color:#00a85a}
.market-deal-card{
  border:1px solid var(--line);border-radius:14px;padding:16px;background:#ffffff;
  box-shadow:0 1px 2px rgba(56,0,60,.04);
}

/* Discord FAB */
.discord-fab{
  position:fixed;right:18px;bottom:18px;z-index:150;display:inline-flex;align-items:center;gap:8px;
  padding:11px 16px;border:none;border-radius:999px;
  background:linear-gradient(135deg,#5865F2,#404EED);color:#ffffff;text-decoration:none;
  font-size:11px;font-weight:900;letter-spacing:.7px;
  box-shadow:0 6px 22px rgba(88,101,242,.4);
  transition:transform .16s,box-shadow .16s;
}
.discord-fab:hover{transform:translateY(-3px);box-shadow:0 9px 30px rgba(88,101,242,.55)}
.discord-fab .discord-icon{font-size:16px;line-height:1}
@media (max-width:640px){
  .market-player-row{grid-template-columns:minmax(0,1fr) auto;gap:6px}
  .market-player-status{grid-column:1 / -1;text-align:left}
  .discord-fab{right:12px;bottom:12px;padding:9px 12px;font-size:10px}
}

@media (max-width:640px){
  body{font-size:14px}
  .brand{font-size:16px;letter-spacing:.3px}
  .view-head h2{font-size:20px}
  .modal-body{padding:14px;max-height:calc(100vh - 130px)}
  .btn{padding:9px 14px;font-size:10.5px}
  table{font-size:12px;min-width:460px}
  th,td{padding:8px 9px}
  .grid.g3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .grid.g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .navbtn{padding:8px 13px;font-size:10.5px}
}


/* ===== UPL MATCHDAY UI REFRESH — presentation only; existing views/actions remain intact ===== */
:root{
 --bg:#080b18;--bg-subtle:#10162a;--bg-tint:#121a31;--ink:#f4f6ff;--ink-2:#dce2f5;
 --dim:#9ba7c4;--line:rgba(167,185,231,.15);--line-2:rgba(167,185,231,.28);
 --panel:#111a30;--pl-purple:#171f3b;--pl-purple-dark:#080d20;--pl-purple-mid:#202d50;
 --pl-purple-light:#1a2542;--pl-purple-wash:#0e1528;--pl-pink:#ff386b;--pl-cyan:#4ce7ef;
 --pl-green:#42e69a;--pl-gold:#ffd166;--txt:#f4f6ff;--radius:16px;
}
body{background:radial-gradient(ellipse at 50% -15%,#28345d 0%,#10172d 42%,#080b18 78%);color:var(--ink)}
body::before{height:760px;background:radial-gradient(ellipse 80% 90% at 50% 0%,rgba(91,113,190,.22),transparent 68%),radial-gradient(ellipse 45% 55% at 8% 0%,rgba(255,56,107,.12),transparent 65%),radial-gradient(ellipse 45% 55% at 92% 0%,rgba(76,231,239,.1),transparent 65%)}
body::after{background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(#000,transparent 65%)}
header.top{background:linear-gradient(115deg,rgba(7,12,29,.97),rgba(22,31,60,.97) 55%,rgba(33,20,55,.97));border-bottom:1px solid rgba(255,255,255,.12);box-shadow:0 10px 40px rgba(0,0,0,.35);backdrop-filter:blur(18px)}
.brandbar{padding-top:19px}.brand{font-size:22px;letter-spacing:1px;text-shadow:0 0 24px rgba(76,231,239,.2)}
.brand .ball{filter:drop-shadow(0 0 10px rgba(255,209,102,.5))}
.season-chip,.cloud-badge{border-radius:999px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.17)}
nav.nav{padding-top:13px}
.navbtn{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.12);color:#dce5ff;border-radius:999px;box-shadow:none}
.navbtn:hover{background:rgba(76,231,239,.13);border-color:rgba(76,231,239,.55);color:#fff;box-shadow:0 6px 20px rgba(76,231,239,.12)}
.navbtn.active{background:linear-gradient(110deg,#4ce7ef,#a3f5e0);color:#081323;border-color:transparent;box-shadow:0 5px 22px rgba(76,231,239,.22)}
.navbtn.ghost{background:rgba(255,56,107,.12);color:#ff8ca8;border-color:rgba(255,56,107,.25)}
.navbtn.admin{background:rgba(255,209,102,.12);color:#ffdc8b;border-color:rgba(255,209,102,.25)}
.view-head h2,.section-title,.tos-top,.trk-team-head{color:#f2f5ff}
.view-head::after{height:2px;background:linear-gradient(90deg,#4ce7ef,#ff386b,transparent)}
.section-title::before{background:linear-gradient(180deg,#4ce7ef,#ff386b)}
.section-title::after{background:linear-gradient(90deg,rgba(164,185,235,.28),transparent)}
.card,.grade-tile,.statbox,.match-card,.tos-card,.leg-block,.ko-tie,.market-deal-card,.tblwrap,.bd-podium-card{
 background:linear-gradient(145deg,rgba(23,33,60,.96),rgba(13,20,39,.98));border-color:var(--line);color:var(--ink);box-shadow:0 8px 28px rgba(0,0,0,.18)
}
.card::before,.statbox::before,.tos-card::before{background:linear-gradient(90deg,#4ce7ef,#8d7cff,#ff386b)}
.card:hover,.match-card:hover{border-color:rgba(76,231,239,.55);box-shadow:0 18px 38px rgba(0,0,0,.32),0 0 24px rgba(76,231,239,.08);transform:translateY(-4px)}
.grade-tile h4,.kv b,.mc-team,.trk-name,.market-player-main b,.bd-player-name,.tos-name{color:#f4f6ff}
.grade-tile ul,.grade-tile .gc-note,.muted,.hint,.small,.tiny{color:var(--dim)}
th{background:#202b4a;color:#9ff5f4;border-color:var(--line)}
td{color:#e8edff;border-color:var(--line)}
tbody tr:nth-child(even){background:rgba(255,255,255,.025)}
tbody tr:hover{background:rgba(76,231,239,.08)}
input,select,textarea{background:#0b1225;color:#f4f6ff;border-color:rgba(167,185,231,.25);border-radius:10px}
input:focus,select:focus,textarea:focus{border-color:#4ce7ef;box-shadow:0 0 0 3px rgba(76,231,239,.13)}
.btn{background:#1a2542;color:#edf3ff;border-color:rgba(167,185,231,.25);border-radius:999px;box-shadow:none}
.btn:hover{background:#4ce7ef;color:#071322;border-color:#4ce7ef;box-shadow:0 8px 22px rgba(76,231,239,.2)}
.btn.magenta{background:#ff386b;color:#fff;border-color:#ff386b}
.btn.gold{background:#ffd166;color:#1c1930;border-color:#ffd166}
.btn.lime{background:#42e69a;color:#071b17;border-color:#42e69a}

async function initDatabase(){
  const configured = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.authDomain &&

      import(base + 'firebase-app.js'),
      import(base + 'firebase-auth.js'),
      import(base + 'firebase-firestore.js')
    ]);
    firebaseApp = appSdk.initializeApp(FIREBASE_CONFIG);
    authClient = authSdk.getAuth(firebaseApp);
    dbClient = firestoreSdk.getFirestore(firebaseApp);
    firebaseApi = {
      signInWithEmailAndPassword: authSdk.signInWithEmailAndPassword,
      signInAnonymously: authSdk.signInAnonymously,
      signOut: authSdk.signOut,

function teamLogo(team, size){
  size = Number(size) || 26;
  const cls = 'tlogo' + (size >= 38 ? ' lg' : (size <= 20 ? ' sm' : ''));

  const style = `width:${size}px;height:${size}px;border-color:${esc(color)};font-size:${Math.round(size * 0.56)}px;`;

  const letter = name ? name.trim().charAt(0).toUpperCase() : '';
  return `<span class="${cls}" style="${style}color:${esc(color)};background:${esc(color)}18;">${letter ? esc(letter) : '🛡️'}</span>`;
}

}

function poisson(lambda){
  const L = Math.exp(-Math.max(0.05, lambda));
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}

function defaultState(){
  return {
    leagueName: 'Unmatched Premier League',
    seasonName: '2026 Season',

      disabledAwards: [],

const app = {
  state: null, currentView: 'registry', user: null, isAdmin: false,
  _draft: null,
  _hypeReady: false,
  _hypeDocs: {}, _hypeCounts: {}, _hypedPlayerIds: {}, _activePlayerProfileId: null,
  _pendingCloudSave: false, _cloudRevision: 0
};
window.app = app;
const econ = () => app.state.settings.economy;

function hydrate(raw){
  const d = defaultState();
  const s = Object.assign({}, d, raw || {});
  s.settings = Object.assign({}, d.settings, (raw && raw.settings) || {});
  const re = (raw && raw.settings && raw.settings.economy) || {};
  s.settings.economy = Object.assign({}, d.settings.economy, re);
  s.settings.economy.enabled = Object.assign({}, d.settings.economy.enabled, re.enabled || {});
  const rg = (raw && raw.settings && raw.settings.grading) || {};
  s.settings.grading = {};
  ['S','A','B'].forEach(k => s.settings.grading[k] = Object.assign({}, d.settings.grading[k], rg[k] || {}));
  const rh = (raw && raw.settings && raw.settings.hype) || {};
  s.settings.hype = Object.assign({}, d.settings.hype, rh);
  const rb = (raw && raw.settings && raw.settings.ballondor) || {};
  s.settings.ballondor = Object.assign({}, d.settings.ballondor, rb);
  if ((Number(rb._formulaVersion) || 0) < 2){
    Object.assign(s.settings.ballondor, BALLONDOR_DEFAULT);
    s._needsBallonFormulaPersist = true;
  }
  if (!s.hypeCycleId){
    const seed = String(s.seasonName || 'current-season').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 48) || 'current-season';
    s.hypeCycleId = 'legacy_' + seed;
  }
  if (raw && !raw.hypeCycleId) s._needsHypeCyclePersist = true;
  if (!Array.isArray(s.settings.disabledAwards)) s.settings.disabledAwards = [];
  ['teams','players','matches','fixtures','tournaments','archives','logs','guide'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  return s;
}

function migrate(){
  let changed = false;
  if (app.state._needsHypeCyclePersist){ delete app.state._needsHypeCyclePersist; changed = true; }
  if (app.state._needsBallonFormulaPersist){ delete app.state._needsBallonFormulaPersist; changed = true; }

  app.state.players.forEach(p => {
    if (p.retired){ p.freeAgent = true; delete p.retired; delete p.retiredAt; changed = true; }
    if (p.freeAgent === undefined){ p.freeAgent = false; changed = true; }
    if (p.loanStatus && p.loanStatus.legsTotal === undefined){
      const oldLoan = p.loanStatus;
      const remaining = Math.max(1, Number(oldLoan.legsRemaining) || 1);
      const history = p.transferHistory || [];
      const latestLoan = history.slice().reverse().find(h => h.type === 'loan');
      oldLoan.to = oldLoan.to || p.teamId;
      oldLoan.legsTotal = remaining; oldLoan.legsPlayed = 0; oldLoan.legsRemaining = remaining;
      oldLoan.feeTotal = Number(oldLoan.fee) || 0; oldLoan.paid = Number(oldLoan.fee) || 0;
      oldLoan.legacyPrepaid = true;
      oldLoan.startedAt = oldLoan.startedAt || (latestLoan && latestLoan.ts) || Date.now();
      oldLoan.processedMatchIds = Array.isArray(oldLoan.processedMatchIds) ? oldLoan.processedMatchIds : [];
      changed = true;
    }
  });

  app.state.matches.forEach(m => {
    if (m.playerTeams) return;
    m.playerTeams = {};
    const A = m.teamAId, B = m.teamBId;
    Object.keys(m.playerStats || {}).forEach(pid => {
      const p = playerById(pid);
      if (!p) return;
      if (p.teamId === A || p.teamId === B) { m.playerTeams[pid] = p.teamId; return; }
      const hist = (p.transferHistory || []);
      for (const h of hist){
        if (h.from === A || h.from === B) { m.playerTeams[pid] = h.from; return; }
        if (h.to === A || h.to === B) { m.playerTeams[pid] = h.to; return; }
      }
      m.playerTeams[pid] = A;
    });
    changed = true;
  });
  return changed;
}

function currentHypeCycleId(){ return (app.state && app.state.hypeCycleId) || 'legacy_current-season'; }
function hypeCounterId(playerId, cycleId){ return String(cycleId || currentHypeCycleId()) + '__' + String(playerId); }
function currentHypeVoterId(){ return (authClient && authClient.currentUser && authClient.currentUser.uid) || 'local-browser'; }
function rebuildHypeCountMap(){
  const cycleId = currentHypeCycleId();
  const counts = {};
  Object.keys(app._hypeDocs || {}).forEach(docId => {
    const d = app._hypeDocs[docId] || {};
    if (d.cycleId === cycleId && d.playerId) counts[d.playerId] = Math.max(0, Number(d.count) || 0);
  });
  app._hypeCounts = counts;
}
function getHypeCount(playerId){ return Math.max(0, Number((app._hypeCounts || {})[playerId]) || 0); }
function loadHype(){
  try { app._hypeDocs = JSON.parse(localStorage.getItem(LS_HYPE_COUNTS) || '{}'); }
  catch(e){ app._hypeDocs = {}; }
  loadHypedPlayerIds();
  rebuildHypeCountMap();
  app._hypeReady = true;
}
function saveHypeDocs(){ try { localStorage.setItem(LS_HYPE_COUNTS, JSON.stringify(app._hypeDocs)); } catch(e){} }
function loadHypedPlayerIds(){
  try {
    const all = JSON.parse(localStorage.getItem(LS_HYPE_VOTES) || '{}');
    const cycle = currentHypeCycleId();
    const voterId = currentHypeVoterId();
    const bucket = all[cycle] || {};
    // Support the old browser-only format while keeping new anonymous votes scoped to this Firebase UID.
    const votes = (bucket[voterId] && typeof bucket[voterId] === 'object') ? bucket[voterId]
      : (Object.keys(bucket).some(k => k !== voterId && typeof bucket[k] === 'boolean') ? bucket : {});
    app._hypedPlayerIds = {};
    Object.keys(votes).forEach(pid => { if (votes[pid]) app._hypedPlayerIds[pid] = true; });
  } catch(e){ app._hypedPlayerIds = {}; }
}
function saveHypedPlayerIds(){
  try {
    const all = JSON.parse(localStorage.getItem(LS_HYPE_VOTES) || '{}');
    const cycle = currentHypeCycleId();
    if (!all[cycle] || typeof all[cycle] !== 'object') all[cycle] = {};
    all[cycle][currentHypeVoterId()] = app._hypedPlayerIds;
    localStorage.setItem(LS_HYPE_VOTES, JSON.stringify(all));
  } catch(e){}
}
function resetHypeForNewCycle(){
  // Keep old-season totals cached; rebuildHypeCountMap filters to the new cycle automatically.
  app._hypedPlayerIds = {};
  saveHypedPlayerIds();
  rebuildHypeCountMap();
}
function watchHypeCounts(){
  if (!dbClient || hypeUnsubscribe) return;
  const countsRef = firebaseApi.collection(dbClient, 'hype_counts');
  hypeUnsubscribe = firebaseApi.onSnapshot(countsRef, snapshot => {
    const docs = {};
    snapshot.forEach(docSnap => { docs[docSnap.id] = docSnap.data() || {}; });
    app._hypeDocs = docs;
    rebuildHypeCountMap();
    saveHypeDocs();
    app._hypeReady = true;
    render();
  }, err => {
    console.error('Firestore Hype listener failed:', err);

async function castPlayerHype(playerId){
  const player = playerById(playerId);
  if (!player) return toast('⚠️ Player not found', 'err');
  if (app._hypedPlayerIds[playerId]) return toast('🔥 You have already hyped this player this season.', 'err');
  if (!dbClient || !authClient) return toast('Firebase is not connected, so anonymous Hype voting is unavailable.', 'err');
  try {
    let voter = authClient.currentUser;
    if (!voter) voter = (await firebaseApi.signInAnonymously(authClient)).user;
    if (!voter) throw new Error('Could not create an anonymous voter session.');
    const cycleId = currentHypeCycleId();
    const voteRef = hypeVoteRef(playerId, cycleId, voter.uid);
    const countRef = hypeCountRef(playerId, cycleId);
    let committedCount = 0;
    await firebaseApi.runTransaction(dbClient, async transaction => {
      const voteSnap = await transaction.get(voteRef);
      if (voteSnap.exists()) throw new Error('ALREADY_VOTED');
      const countSnap = await transaction.get(countRef);
      const count = countSnap.exists() ? Math.max(0, Number(countSnap.data().count) || 0) : 0;
      committedCount = count + 1;
      transaction.set(voteRef, {
        uid: voter.uid,
        cycleId,
        playerId: String(playerId),
        createdAt: Date.now()
      });
      transaction.set(countRef, {
        cycleId,
        playerId: String(playerId),
        count: count + 1,
        updatedAt: Date.now()
      });
    });
    app._hypedPlayerIds[playerId] = true;
    saveHypedPlayerIds();
    app._hypeDocs[hypeCounterId(playerId, cycleId)] = { cycleId, playerId, count: committedCount };
    rebuildHypeCountMap();
    saveHypeDocs();
    if (app._activePlayerProfileId === playerId) openPlayerProfile(playerId);
    else render();
    const perHype = Math.max(0, Number((app.state.settings.hype || HYPE_DEFAULT).valuePerHype) || 0);
    const hypePoints = Number((app.state.settings.ballondor || BALLONDOR_DEFAULT).hype) || 0;
    toast(`🔥 Anonymous Hype sent to ${esc(player.name)}! +${money(perHype)} value and +${hypePoints} Ballon d'Or point.`, 'ok');
  } catch(e) {
    console.error('Anonymous Hype vote failed:', e);
    if (String(e.message || '').includes('ALREADY_VOTED')) {
      app._hypedPlayerIds[playerId] = true;
      saveHypedPlayerIds();
      if (app._activePlayerProfileId === playerId) openPlayerProfile(playerId);
      return toast('🔥 You have already hyped this player this season.', 'err');
    }
    toast('Could not send Hype. Make sure Anonymous sign-in is enabled and the latest Firestore rules are published.', 'err');
  }
}

async function saveState(opts){
  opts = opts || {};
  const stateSnapshot = JSON.stringify(app.state);
  try { localStorage.setItem(LS_KEY, stateSnapshot); } catch(e){ console.warn('Local backup save failed:', e); }
  try { localStorage.setItem(LS_LOGS, JSON.stringify((app.state.logs || []).slice(-200))); } catch(e){}
  if (!(dbClient && app.isAdmin && app.user && ADMIN_UIDS.includes(String(app.user.uid||'')))) return false;

  app._pendingCloudSave = true;
  try { localStorage.setItem(LS_PENDING_CLOUD_SAVE, String(Date.now())); } catch(e){}
  setCloudBadge('⏳ SAVING TO CLOUD', false);
  try {
    const updatedAt = new Date().toISOString();
    const publicState = Object.assign({}, JSON.parse(stateSnapshot), { logs: [] });
    const expectedRevision = Number(app._cloudRevision) || 0;
    const nextRevision = await firebaseApi.runTransaction(dbClient, async transaction => {
      const stateRef = leagueStateRef();
      const logsRef = adminLogsRef();
      const stateSnap = await transaction.get(stateRef);
      const logsSnap = await transaction.get(logsRef);
      const actualRevision = stateSnap.exists() ? (Number(stateSnap.data().revision) || 0) : 0;
      if (actualRevision !== expectedRevision) {
        const conflict = new Error('CLOUD_CONFLICT');
        conflict.code = 'app/cloud-conflict';
        throw conflict;
      }
      const revision = actualRevision + 1;
      transaction.set(stateRef, {
        state: publicState, updatedAt, updatedBy: 'Admin', revision
      }, { merge: true });
      transaction.set(logsRef, {
        logs: (app.state.logs || []).slice(-500), updatedAt
      }, { merge: true });
      return revision;
    });
    app._cloudRevision = nextRevision;
    clearPendingCloudSave();
    setCloudBadge('☁️ FIRESTORE SYNCED', true);
    return true;
  } catch(e) {
    console.error('Firestore save failed:', e);
    app._pendingCloudSave = true;
    setCloudBadge(e && e.code === 'app/cloud-conflict' ? '⚠️ CLOUD CONFLICT' : '⚠️ UNSAVED CHANGES', false);
    if (e && e.code === 'app/cloud-conflict') {
      toast('Another admin saved newer data. Your local changes are protected; refresh the league before retrying to avoid overwriting their work.', 'err');
    } else {
      toast('Cloud save failed. Your changes are saved locally and marked for retry; they will not be silently replaced on reload.', 'err');
    }
    return false;
  }
}

function matchLegs(m){
  const legs = [];
  for (let i = 1; i <= 4; i++){
    const a = m['leg'+i+'ScoreA'], b = m['leg'+i+'ScoreB'];
    if (a === null || a === undefined || a === '' || b === null || b === undefined || b === '') continue;
    legs.push({ n:i, a:Number(a), b:Number(b) });
  }
  return legs;
}
function matchFoulPenalty(m, teamId){
  return (Array.isArray(m && m.fouls) ? m.fouls : []).reduce((sum, foul) => {
    if (!foul || !String(foul.description || '').trim() || foul.teamId !== teamId) return sum;
    const points = Number(foul.points);
    return sum + (points === 2 ? 2 : points === 1 ? 1 : 0);
  }, 0);
}
function matchAggregate(m){
  const legs = matchLegs(m);
  let rawA = 0, rawB = 0;
  legs.forEach(l => { rawA += l.a; rawB += l.b; });
  const penaltyA = matchFoulPenalty(m, m.teamAId);
  const penaltyB = matchFoulPenalty(m, m.teamBId);
  const a = Math.max(0, rawA - penaltyA);
  const b = Math.max(0, rawB - penaltyB);
  return { legs, rawA, rawB, penaltyA, penaltyB, a, b, res: a > b ? 'A' : (b > a ? 'B' : 'D') };
}
function legCount(m){
  for (let i = 4; i >= 1; i--){
    const a = m['leg'+i+'ScoreA'];
    if (a !== null && a !== undefined && a !== '') return i;
  }
  return 0;
}

function teamForMatch(m, pid){
  if (m.playerTeams && m.playerTeams[pid]) return m.playerTeams[pid];
  const p = playerById(pid);
  return p ? p.teamId : null;
}

function computePlayerStats(){
  const E = econ();
  const st = {};
  const get = id => st[id] || (st[id] = {
    goals:0, assists:0, saves:0, tackles:0, legsPlayed:0, legs:0,
    mvp:0, motm:0, matches:0, growth:0, playerValue:0, marketValue:0,
    legLog: []
  });
  app.state.players.forEach(p => get(p.id));

  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const ps = m.playerStats || {};
    const playedSet = new Set();
    Object.keys(ps).forEach(pid => {
      if (!playerById(pid)) return;
      const legs = ps[pid];
      if (!Array.isArray(legs)) return;
      const s = get(pid);
      let playedAny = false;
      legs.forEach((lg, i) => {
        if (!lg || !lg.played) return;
        if (i >= agg.legs.length) return;
        playedAny = true;
        s.legsPlayed++;
        const g = +lg.goals || 0, a = +lg.assists || 0, sv = +lg.saves || 0, tk = +lg.tackles || 0;
        s.goals += g; s.assists += a; s.saves += sv; s.tackles += tk;
        s.legLog.push({ matchId: m.id, leg: i + 1, g, a, s: sv, t: tk });
      });
      if (playedAny) playedSet.add(pid);
    });
    playedSet.forEach(pid => get(pid).matches++);
    if (m.mvpId && playerById(m.mvpId))  get(m.mvpId).mvp++;
    if (m.motmId && playerById(m.motmId)) get(m.motmId).motm++;
  });

  app.state.players.forEach(p => {
    const s = get(p.id);
    const en = E.enabled;
    let growth = 0;
    if (en.goal)   growth += s.goals   * E.goal;
    if (en.assist) growth += s.assists * E.assist;
    if (en.save)   growth += s.saves   * E.save;
    if (en.tackle) growth += s.tackles * E.tackle;
    if (en.mvp)    growth += s.mvp     * E.mvp;
    if (en.motm)   growth += s.motm    * E.motm;
    const hypeCount = getHypeCount(p.id);
    const hypeReward = Math.max(0, Number((app.state.settings.hype || HYPE_DEFAULT).valuePerHype) || 0);
    const hypeGrowth = hypeCount * hypeReward;
    growth += hypeGrowth;
    s.hypeCount = hypeCount;
    s.hypeValueBonus = hypeGrowth;
    s.growth = growth;
    const start = (p.startingValue === undefined || p.startingValue === null) ? E.playerStart : p.startingValue;
    s.startingValue = start;
    s.playerValue = Math.min(E.cap, start + growth);
    s.marketValue = s.playerValue;
  });
  return st;
}

function gradingCfg(){ return app.state.settings.grading; }

function gradeStats(goals, assists, saves, tackles){
  const C = gradingCfg();
  const clears = k => {
    const c = C[k] || {};
    const bars = [
      [+c.goals   || 0, +goals   || 0],
      [+c.assists || 0, +assists || 0],
      [+c.saves   || 0, +saves   || 0],
      [+c.tackles || 0, +tackles || 0]
    ];
    return bars.some(([need, got]) => need > 0 && got >= need);
  };
  if (clears('S')) return 'S';
  if (clears('A')) return 'A';
  if (clears('B')) return 'B';
  return 'C';
}

function legGrade(l){
  l = l || {};
  const g = (l.g !== undefined && l.g !== null) ? l.g : (l.goals || 0);
  const a = (l.a !== undefined && l.a !== null) ? l.a : (l.assists || 0);
  const s = (l.s !== undefined && l.s !== null) ? l.s : (l.saves || 0);
  const t = (l.t !== undefined && l.t !== null) ? l.t : (l.tackles || 0);
  return gradeStats(+g || 0, +a || 0, +s || 0, +t || 0);
}

function avgGrade(avg){
  avg = avg || {};
  return gradeStats(+avg.goals || 0, +avg.assists || 0, +avg.saves || 0, +avg.tackles || 0);
}

// Position inference uses per-match production, so players with more appearances
// do not win simply by accumulating larger totals.
function inferPlayerPosition(st){
  st = st || {};
  const n = Math.max(1, Number(st.legsPlayed)||0);
  const g = (Number(st.goals)||0)/n;
  const a = (Number(st.assists)||0)/n;
  const sv = (Number(st.saves)||0)/n;
  const tk = (Number(st.tackles)||0)/n;
  const scores = {
    'Striker': g*5.0 + a*1.5,
    'Playmaker': a*4.5 + g*1.2,
    'Defender': tk*3.0 + sv*0.5,
    'Goalkeeper': sv*4.0 + tk*0.15
  };
  const ranked = Object.entries(scores).sort((x,y)=>y[1]-x[1]);
  const top = ranked[0][1], second = ranked[1][1];
  if ((g+a+sv+tk) === 0) return 'Unclassified';
  if (top < 0.35 || (top-second) < 0.18 && (g+a+sv+tk) > 2.5) return 'All-Rounder';
  return ranked[0][0];
}

function playerAverages(st){
  const n = Math.max(1, st.legsPlayed);
  return {
    goals: st.goals / n, assists: st.assists / n,
    saves: st.saves / n, tackles: st.tackles / n,
    games: st.legsPlayed
  };
}

function computeStandings(){
  const map = {};
  app.state.teams.forEach(t => {
    map[t.id] = { id:t.id, name:t.name, color:t.color, value:t.value || 0,
      mp:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0,
      form:[], comebacks:0, streak:0, best:0, wall:0 };
  });
  const ms = app.state.matches.slice().sort((a,b) => (a.timestamp||0) - (b.timestamp||0));
  ms.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const A = map[m.teamAId], B = map[m.teamBId];
    if (!A || !B) return;
    A.mp++; B.mp++;
    A.gf += agg.a; A.ga += agg.b;
    B.gf += agg.b; B.ga += agg.a;
    if (agg.res === 'A'){
      A.w++; B.l++; A.pts += 3;
      A.form.push('W'); B.form.push('L');
      A.streak++; B.streak = 0;
      if (A.streak > A.best) A.best = A.streak;
      const l1 = agg.legs[0];
      if (l1 && l1.a <= l1.b) A.comebacks++;
    } else if (agg.res === 'B'){
      B.w++; A.l++; B.pts += 3;
      B.form.push('W'); A.form.push('L');
      B.streak++; A.streak = 0;
      if (B.streak > B.best) B.best = B.streak;
      const l1 = agg.legs[0];
      if (l1 && l1.b <= l1.a) B.comebacks++;
    } else {
      A.d++; B.d++; A.pts++; B.pts++;
      A.form.push('D'); B.form.push('D');
      A.streak = 0; B.streak = 0;
    }
  });
  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const ps = m.playerStats || {};
    Object.keys(ps).forEach(pid => {
      if (!playerById(pid)) return;
      const tid = teamForMatch(m, pid);
      if (!tid || !map[tid]) return;
      const legs = ps[pid];
      if (!Array.isArray(legs)) return;
      legs.forEach((lg, i) => {
        if (!lg || !lg.played || i >= agg.legs.length) return;
        map[tid].wall += (+lg.tackles||0) + (+lg.saves||0);
      });
    });
  });
  Object.values(map).forEach(r => { r.gd = r.gf - r.ga; });
  return map;
}

function standingsSorted(){
  const arr = Object.values(computeStandings());
  arr.sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.name.localeCompare(b.name));
  return arr;
}

function headToHead(teamA, teamB){
  let aGoals = 0, bGoals = 0, aWins = 0, bWins = 0, draws = 0;
  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const isA = m.teamAId === teamA && m.teamBId === teamB;
    const isB = m.teamAId === teamB && m.teamBId === teamA;
    if (!isA && !isB) return;
    const ga = isA ? agg.a : agg.b;
    const gb = isA ? agg.b : agg.a;
    aGoals += ga; bGoals += gb;
    if (ga > gb) aWins++; else if (gb > ga) bWins++; else draws++;
  });
  return { aGoals, bGoals, aWins, bWins, draws };
}

function topContributorsPerLeg(){
  const out = [];
  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const ps = m.playerStats || {};
    for (let i = 0; i < agg.legs.length; i++){
      const byTeam = {};
      Object.keys(ps).forEach(pid => {
        const p = playerById(pid);
        if (!p) return;
        const lg = (ps[pid] || [])[i];
        if (!lg || !lg.played) return;
        const tid = teamForMatch(m, pid);
        if (!tid) return;
        const score = (+lg.goals||0)*5 + (+lg.assists||0)*3 + (+lg.saves||0)*1 + (+lg.tackles||0)*0.5;
        (byTeam[tid] = byTeam[tid] || []).push({ pid, score, g:+lg.goals||0, a:+lg.assists||0 });
      });
      Object.keys(byTeam).forEach(tid => {
        byTeam[tid].sort((x,y) => y.score - x.score);
        out.push({ matchId:m.id, leg:i+1, teamId:tid, players: byTeam[tid] });
      });
    }
  });
  return out;
}

function oneManArmy(){
  const counts = {};
  topContributorsPerLeg().forEach(entry => {
    if (!entry.players.length) return;
    const top = entry.players[0];
    if (top.score <= 0) return;
    counts[top.pid] = (counts[top.pid] || 0) + 1;
  });
  return counts;
}

function bestDuo(){
  let best = null;
  topContributorsPerLeg().forEach(entry => {
    if (entry.players.length < 2) return;
    const a = entry.players[0], b = entry.players[1];
    const total = (a.g + a.a) + (b.g + b.a);
    if (!best || total > best.total){
      const p1 = playerById(a.pid);
      const p2 = playerById(b.pid);
      if (!p1 || !p2) return;
      best = { total, a, b, teamId: entry.teamId, matchId: entry.matchId, leg: entry.leg, label: `${p1.name} & ${p2.name}` };
    }
  });
  return best;
}

function teamGoalDistribution(){

  app.state.teams.forEach(t => dist[t.id] = { total: 0, top: 0, topName: '-' });
  app.state.matches.forEach(m => {
    const agg = matchAggregate(m);

      if (!p) return;

      const legs = ps[pid];

        if (goals > dist[tid].top){ dist[tid].top = goals; dist[tid].topName = p.name; }
      });
    });
  });
  return dist;
}

function ballonDor(){
  const st = computePlayerStats();
  const R = Object.assign({}, BALLONDOR_DEFAULT, app.state.settings.ballondor || {});
  const table = standingsSorted();
  const rankOf = {};
  table.forEach((r, i) => rankOf[r.id] = i + 1);
  const leaders = key => {
    const entries = Object.keys(st).filter(pid => playerById(pid));
    const maximum = entries.reduce((m, pid) => Math.max(m, Number(st[pid][key]) || 0), 0);
    if (maximum <= 0) return new Set();
    return new Set(entries.filter(pid => (Number(st[pid][key]) || 0) === maximum));
  };
  const bootIds = leaders('goals');
  const playIds = leaders('assists');
  const gloveIds = leaders('saves');
  const defenderIds = leaders('tackles');
  const oma = oneManArmy();
  const omaMaximum = Object.keys(oma).reduce((m, pid) => Math.max(m, Number(oma[pid]) || 0), 0);
  const omaLeaders = new Set(omaMaximum > 0
    ? Object.keys(oma).filter(pid => (Number(oma[pid]) || 0) === omaMaximum)
    : []);
  const teamBonusForRank = rank => {
    if (rank === 1) return Number(R.teamRank1) || 0;
    if (rank === 2) return Number(R.teamRank2) || 0;
    if (rank === 3) return Number(R.teamRank3) || 0;
    return 0;
  };
  const rows = app.state.players.map(p => {
    const s = st[p.id] || {};
    const rank = rankOf[p.teamId] || (app.state.teams.length + 1);
    const teamBonus = teamBonusForRank(rank);
    const pts =
      (s.goals || 0) * Number(R.goals) +
      (s.assists || 0) * Number(R.assists) +
      (s.saves || 0) * Number(R.saves) +
      (s.tackles || 0) * Number(R.tackles) +
      ((s.mvp || 0) + (s.motm || 0)) * Number(R.mvpMotm) +
      teamBonus +
      (bootIds.has(p.id) ? Number(R.topScorerBonus) : 0) +
      (playIds.has(p.id) ? Number(R.topPlaymakerBonus) : 0) +
      (gloveIds.has(p.id) ? Number(R.topSavesBonus) : 0) +
      (defenderIds.has(p.id) ? Number(R.topTacklesBonus) : 0) +
      (omaLeaders.has(p.id) ? Number(R.oneManArmy) : 0) +
      (getHypeCount(p.id) * Number(R.hype));
    return { player: p, pts, s, rank, teamBonus, hypeCount: getHypeCount(p.id) };
  });
  rows.sort((a,b) => b.pts - a.pts || a.player.name.localeCompare(b.player.name));
  return rows;
}
