function teamStrength(teamId){
  const ps = app.state.players.filter(p => p.teamId === teamId && isActivePlayer(p));
  if (!ps.length) return 1;
  const st = computePlayerStats();
  const vals = ps.map(p => st[p.id] ? st[p.id].playerValue : econ().playerStart);
  const avg = vals.reduce((a,b) => a + b, 0) / vals.length;
  const treasury = Math.max(0, teamById(teamId).value || 0);
  return Math.max(0.4, (avg / 1e6) * 0.6 + (treasury / 1e8) * 0.4);
}

function pickWeighted(list, weightFn){
  let total = 0;
  list.forEach(x => total += Math.max(0.0001, weightFn(x)));
  let r = Math.random() * total;
  for (const x of list){
    r -= Math.max(0.0001, weightFn(x));
    if (r <= 0) return x;
  }
  return list[list.length - 1];
}

function simulateTeamLeg(teamId, goals, conceded, legIndex){
  const roster = app.state.players.filter(p => p.teamId === teamId && isActivePlayer(p));
  const st = computePlayerStats();
  const out = {};
  if (!roster.length) return out;
  const w = p => (st[p.id] ? st[p.id].playerValue : 1e6);
  roster.forEach(p => { out[p.id] = { played: true, goals:0, assists:0, saves:0, tackles:0 }; });
  for (let i = 0; i < goals; i++){
    const scorer = pickWeighted(roster, w);
    out[scorer.id].goals++;
    if (Math.random() < 0.68){
      const others = roster.filter(p => p.id !== scorer.id);
      if (others.length) out[pickWeighted(others, w).id].assists++;
    }
  }
  roster.forEach(p => {
    const s = st[p.id];
    const defensiveBias = s ? (s.tackles + 1) / (s.goals + s.assists + 1) : 1;
    out[p.id].tackles = Math.round(Math.random() * 4 * clamp(defensiveBias, 0.4, 2));
    out[p.id].saves   = Math.round(Math.random() * (conceded > 0 ? 5 : 3) * clamp(defensiveBias, 0.4, 2));
  });
  roster.forEach(p => { if (Math.random() < 0.12) out[p.id].played = false; });
  return out;
}

function simulateFixture(fixtureId){
  const f = fixtureById(fixtureId);
  if (!f) return null;
  const legs = f.legs || 1;
  const sA = teamStrength(f.teamAId);
  const sB = teamStrength(f.teamBId);
  const total = sA + sB || 1;
  const expA = 3.1 * (sA / total);
  const expB = 3.1 * (sB / total);
  const m = {
    id: uuid(), teamAId: f.teamAId, teamBId: f.teamBId, fixtureId: f.id, timestamp: Date.now(),
    mvpId: null, motmId: null, mvpSnapshot: null, motmSnapshot: null,
    playerStats: {}, playerTeams: {}
  };
  for (let i = 1; i <= legs; i++){
    const ga = poisson(expA * (1 + (Math.random() - 0.5) * 0.3));
    const gb = poisson(expB * (1 + (Math.random() - 0.5) * 0.3));
    m['leg'+i+'ScoreA'] = ga; m['leg'+i+'ScoreB'] = gb;
    const statsA = simulateTeamLeg(f.teamAId, ga, gb, i);
    const statsB = simulateTeamLeg(f.teamBId, gb, ga, i);
    Object.keys(statsA).forEach(pid => {
      m.playerStats[pid] = m.playerStats[pid] || [];
      while (m.playerStats[pid].length < i) m.playerStats[pid].push({ played:false, goals:0, assists:0, saves:0, tackles:0 });
      m.playerStats[pid][i-1] = statsA[pid];
      m.playerTeams[pid] = f.teamAId;
    });
    Object.keys(statsB).forEach(pid => {
      m.playerStats[pid] = m.playerStats[pid] || [];
      while (m.playerStats[pid].length < i) m.playerStats[pid].push({ played:false, goals:0, assists:0, saves:0, tackles:0 });
      m.playerStats[pid][i-1] = statsB[pid];
      m.playerTeams[pid] = f.teamBId;
    });
  }
  for (let i = legs + 1; i <= 4; i++){ m['leg'+i+'ScoreA'] = null; m['leg'+i+'ScoreB'] = null; }
  const contrib = pid => {
    const legsArr = m.playerStats[pid] || [];
    let s = 0;
    legsArr.forEach(l => { if (l && l.played) s += (l.goals||0)*5 + (l.assists||0)*3 + (l.saves||0) + (l.tackles||0)*0.5; });
    return s;
  };
  const sideA = app.state.players.filter(p => p.teamId === f.teamAId && m.playerStats[p.id]);
  const sideB = app.state.players.filter(p => p.teamId === f.teamBId && m.playerStats[p.id]);
  const allPlayers = sideA.concat(sideB).sort((a,b) => contrib(b.id) - contrib(a.id));
  m.mvpId = allPlayers[0]?.id || null;
  m.motmId = allPlayers[1]?.id || allPlayers[0]?.id || null;
  if (m.mvpId){ const p = playerById(m.mvpId); m.mvpSnapshot = p ? { name:p.name, teamId:p.teamId } : null; }
  if (m.motmId){ const p = playerById(m.motmId); m.motmSnapshot = p ? { name:p.name, teamId:p.teamId } : null; }
  applyMatchToState(m, f);
  return m;
}

function cloneLoanStatus(status){ return status ? JSON.parse(JSON.stringify(status)) : null; }

function returnPlayerFromLoan(p, reason, matchId){
  if (!p || !p.loanStatus) return null;
  const loan = p.loanStatus;
  const borrowerTeamId = loan.to || p.teamId;
  const ownerTeamId = loan.from;
  const returnTeamExists = app.state.teams.some(t => t.id === ownerTeamId);
  const paid = Number(loan.paid !== undefined ? loan.paid : loan.fee) || 0;
  const legsPlayed = Number(loan.legsPlayed) || 0;
  if (returnTeamExists) p.teamId = ownerTeamId;
  p.loanStatus = null;
  p.transferHistory = p.transferHistory || [];
  p.transferHistory.push({
    type: 'loan-return', from: borrowerTeamId, to: p.teamId,
    value: paid, legsPlayed, reason: reason || 'manual', matchId: matchId || null, ts: Date.now()
  });
  return { borrowerTeamId, ownerTeamId, paid, legsPlayed, returnedTo: p.teamId };
}

function applyLoanLegsForMatch(m){
  const agg = matchAggregate(m);
  if (!agg.legs.length) return;
  const matchId = String(m.id || '');
  if (!matchId) return;
  m.loanSettlements = [];
  app.state.players.forEach(p => {
    const loan = p.loanStatus;
    if (!loan) return;
    const borrowerTeamId = loan.to || p.teamId;
    if (borrowerTeamId !== m.teamAId && borrowerTeamId !== m.teamBId) return;
    const snapshotTeam = (m.playerTeams && m.playerTeams[p.id]) || p.teamId;
    if (snapshotTeam !== borrowerTeamId) return;
    if (loan.startedAt && m.timestamp && Number(m.timestamp) < Number(loan.startedAt)) return;
    loan.processedMatchIds = Array.isArray(loan.processedMatchIds) ? loan.processedMatchIds : [];
    if (loan.processedMatchIds.includes(matchId)) return;
    const loanBefore = cloneLoanStatus(loan);
    const playedLegs = agg.legs.filter(l => {
      const playerLeg = (m.playerStats && m.playerStats[p.id] || [])[l.n - 1];
      return !!(playerLeg && playerLeg.played);
    });
    const totalLegs = Math.max(1, Number(loan.legsTotal) || Number(loan.legsRemaining) || 1);
    const alreadyPlayed = Math.max(0, Number(loan.legsPlayed) || 0);
    const ownerTeam = app.state.teams.find(t => t.id === loan.from);
    const borrowerTeam = app.state.teams.find(t => t.id === borrowerTeamId);
    let charged = 0;
    let processedPlayed = 0;
    playedLegs.forEach(() => {
      if (alreadyPlayed + processedPlayed >= totalLegs) return;
      processedPlayed++;
      const nextPlayed = alreadyPlayed + processedPlayed;
      if (!loan.legacyPrepaid){
        const feeTotal = Math.max(0, Number(loan.feeTotal !== undefined ? loan.feeTotal : loan.fee) || 0);
        const wasPaid = Math.max(0, Number(loan.paid) || 0);
        const targetPaid = nextPlayed >= totalLegs ? feeTotal : Math.round(feeTotal * nextPlayed / totalLegs);
        const legCharge = Math.max(0, targetPaid - wasPaid);
        if (legCharge){
          if (borrowerTeam) borrowerTeam.value -= legCharge;
          if (ownerTeam) ownerTeam.value += legCharge;
          charged += legCharge;
        }
        loan.paid = targetPaid;
      }
      loan.legsPlayed = nextPlayed;
    });
    loan.legsRemaining = Math.max(0, totalLegs - (Number(loan.legsPlayed) || 0));
    loan.processedMatchIds.push(matchId);
    const settlement = {
      playerId: p.id, loanStartedAt: loan.startedAt || null, matchId,
      ownerTeamId: loan.from, borrowerTeamId,
      loanStatusBefore: loanBefore, playedLegs: processedPlayed,
      charged, autoReturned: false
    };
    if ((Number(loan.legsPlayed) || 0) >= totalLegs){
      returnPlayerFromLoan(p, 'completed', matchId);
      settlement.autoReturned = true;
    }
    m.loanSettlements.push(settlement);
  });
}

function revertLoanSettlements(m){
  if (!m || !Array.isArray(m.loanSettlements) || !m.loanSettlements.length) return;
  const matchId = String(m.id || '');
  m.loanSettlements.forEach(settlement => {
    const p = playerById(settlement.playerId);
    let restoredFromAutoReturn = false;
    if (p && settlement.autoReturned){
      const history = p.transferHistory || [];
      const returnIndex = history.findIndex(h => h.type === 'loan-return' && String(h.matchId || '') === matchId);
      if (returnIndex >= 0){
        history.splice(returnIndex, 1);
        p.teamId = settlement.borrowerTeamId;
        p.loanStatus = cloneLoanStatus(settlement.loanStatusBefore);
        restoredFromAutoReturn = true;
      }
    }
    if (p && !restoredFromAutoReturn && p.loanStatus){
      const sameLoan = settlement.loanStartedAt
        ? p.loanStatus.startedAt === settlement.loanStartedAt
        : (p.loanStatus.from === settlement.ownerTeamId && (p.loanStatus.to || p.teamId) === settlement.borrowerTeamId);
      if (sameLoan){
        p.loanStatus.legsPlayed = Math.max(0, (Number(p.loanStatus.legsPlayed) || 0) - (Number(settlement.playedLegs) || 0));
        const total = Math.max(1, Number(p.loanStatus.legsTotal) || 1);
        p.loanStatus.legsRemaining = Math.max(0, total - p.loanStatus.legsPlayed);
        p.loanStatus.paid = Math.max(0, (Number(p.loanStatus.paid) || 0) - (Number(settlement.charged) || 0));
        p.loanStatus.processedMatchIds = (p.loanStatus.processedMatchIds || []).filter(x => String(x) !== matchId);
      }
    }
    const borrower = app.state.teams.find(t => t.id === settlement.borrowerTeamId);
    const owner = app.state.teams.find(t => t.id === settlement.ownerTeamId);
    const charged = Number(settlement.charged) || 0;
    if (charged){ if (borrower) borrower.value += charged; if (owner) owner.value -= charged; }
  });
  m.loanSettlements = [];
}

function applyMatchToState(m, fixture){
  if (!m.playerTeams){
    m.playerTeams = {};
    Object.keys(m.playerStats || {}).forEach(pid => {
      const p = playerById(pid);
      if (p && p.teamId) m.playerTeams[pid] = p.teamId;
    });
  }
  const E = econ();
  const agg = matchAggregate(m);
  const A = app.state.teams.find(t => t.id === m.teamAId);
  const B = app.state.teams.find(t => t.id === m.teamBId);
  if (A && B){
    if (agg.res === 'A'){
      if (E.enabled.win)  A.value += E.win;
      if (E.enabled.loss) B.value += E.loss;
    } else if (agg.res === 'B'){
      if (E.enabled.win)  B.value += E.win;
      if (E.enabled.loss) A.value += E.loss;
    } else {
      if (E.enabled.draw){ A.value += E.draw; B.value += E.draw; }
    }
  }
  app.state.matches.push(m);
  if (fixture){ fixture.played = true; fixture.matchId = m.id; }
  applyLoanLegsForMatch(m);
  if (fixture && fixture.tournamentId) progressTournament(fixture.tournamentId);
}

function createTournament(name, teamIds, groupCount, koLegs){
  const t = {
    id: uuid(), name: name || 'Cup', format: 'Groups + Knockout',
    teams: teamIds.slice(), groups: [], groupCount, koLegs: koLegs || 1,
    phase: 'group', started: Date.now(), completed: false, winner: null, created: Date.now(), ko: null
  };
  const buckets = Array.from({ length: groupCount }, () => []);
  teamIds.forEach((id, i) => {
    const round = Math.floor(i / groupCount);
    const idx = round % 2 === 0 ? (i % groupCount) : (groupCount - 1 - (i % groupCount));
    buckets[idx].push(id);
  });
  t.groups = buckets;
  app.state.tournaments.push(t);
  t.groups.forEach((g, gi) => {
    for (let i = 0; i < g.length; i++){
      for (let j = i + 1; j < g.length; j++){
        for (let leg = 1; leg <= 2; leg++){
          app.state.fixtures.push({
            id: uuid(), teamAId: leg === 1 ? g[i] : g[j], teamBId: leg === 1 ? g[j] : g[i],
            competition: 'Tournament', round: 'Group ' + String.fromCharCode(65 + gi),
            date: '', legs: 1, played: false, stage: 'group',
            tournamentId: t.id, group: gi
          });
        }
      }
    }
  });
  return t;
}

function groupStandings(t, gi){
  const ids = t.groups[gi] || [];
  const map = {};
  ids.forEach(id => {
    const tm = teamById(id);
    map[id] = { id, name: tm.name, color: tm.color, mp:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0 };
  });
  const fixtures = app.state.fixtures.filter(f => f.tournamentId === t.id && f.stage === 'group' && f.group === gi);
  fixtures.forEach(f => {
    if (!f.played) return;
    const m = app.state.matches.find(x => x.id === f.matchId);
    if (!m) return;
    const agg = matchAggregate(m);
    if (!agg.legs.length) return;
    const A = map[m.teamAId], B = map[m.teamBId];
    if (!A || !B) return;
    A.mp++; B.mp++;
    A.gf += agg.a; A.ga += agg.b; B.gf += agg.b; B.ga += agg.a;
    if (agg.res === 'A'){ A.w++; B.l++; A.pts += 3; }
    else if (agg.res === 'B'){ B.w++; A.l++; B.pts += 3; }
    else { A.d++; B.d++; A.pts++; B.pts++; }
  });
  Object.values(map).forEach(r => r.gd = r.gf - r.ga);
  return Object.values(map).sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
}

function groupComplete(t){
  const fx = app.state.fixtures.filter(f => f.tournamentId === t.id && f.stage === 'group');
  return fx.length > 0 && fx.every(f => f.played);
}

function advanceToKnockout(tid){
  const t = tourById(tid);
  if (!t) return;
  if (!groupComplete(t)){ toast('⚠️ Group stage is not finished yet', 'err'); return; }
  const qualifiers = [];
  t.groups.forEach((g, gi) => {
    const tbl = groupStandings(t, gi);
    tbl.slice(0, 2).forEach((r, idx) => qualifiers.push({ teamId: r.id, seed: gi * 2 + idx + 1, pts: r.pts, gd: r.gd }));
  });
  qualifiers.sort((a,b) => b.pts - a.pts || b.gd - a.gd);
  qualifiers.forEach((q, i) => q.seed = i + 1);
  const qIds = qualifiers.map(q => q.teamId);
  const rounds = [];
  if (qIds.length === 4){
    rounds.push({ name:'Semi-finals', ties: [
      { a: qIds[0], b: qIds[3], winner:null, fixtureIds:[] },
      { a: qIds[1], b: qIds[2], winner:null, fixtureIds:[] }
    ]});
    rounds.push({ name:'Final', ties:[ { a:null, b:null, winner:null, fixtureIds:[] } ]});
  } else if (qIds.length === 6){
    rounds.push({ name:'Quarter-finals', ties: [
      { a: qIds[2], b: qIds[5], winner:null, fixtureIds:[] },
      { a: qIds[3], b: qIds[4], winner:null, fixtureIds:[] }
    ]});
    rounds.push({ name:'Semi-finals', ties: [
      { a: qIds[0], b:null, winner:null, fixtureIds:[] },
      { a: qIds[1], b:null, winner:null, fixtureIds:[] }
    ]});
    rounds.push({ name:'Final', ties:[ { a:null, b:null, winner:null, fixtureIds:[] } ]});
  } else { toast('⚠️ Need 4 or 6 qualifiers', 'err'); return; }
  t.ko = { rounds };
  t.phase = 'knockout';
  materializeKO(t);
  toast('🏁 Knockout stage generated!', 'ok');
}

function materializeKO(t){
  if (!t.ko) return;
  t.ko.rounds.forEach((round, ri) => {
    round.ties.forEach((tie, ti) => {
      if (tie.fixtureIds && tie.fixtureIds.length) return;
      if (!tie.a || !tie.b) return;
      tie.fixtureIds = [];
      const legs = t.koLegs || 1;
      for (let l = 1; l <= legs; l++){
        const f = {
          id: uuid(),
          teamAId: l % 2 === 1 ? tie.a : tie.b,
          teamBId: l % 2 === 1 ? tie.b : tie.a,
          competition: 'Tournament', round: round.name, date: '',
          legs: 1, played: false, stage: 'ko',
          tournamentId: t.id, koRound: ri, koTie: ti
        };
        app.state.fixtures.push(f);
        tie.fixtureIds.push(f.id);
      }
    });
  });
}

function progressTournament(tid){
  const t = tourById(tid);
  if (!t || !t.ko) return;
  t.ko.rounds.forEach((round, ri) => {
    round.ties.forEach((tie, ti) => {
      if (tie.winner) return;
      if (!tie.fixtureIds || !tie.fixtureIds.length) return;
      const fxs = tie.fixtureIds.map(fixtureById).filter(Boolean);
      if (!fxs.length || !fxs.every(f => f.played)) return;
      let aggA = 0, aggB = 0;
      fxs.forEach(f => {
        const m = app.state.matches.find(x => x.id === f.matchId);
        if (!m) return;
        const agg = matchAggregate(m);
        if (m.teamAId === tie.a){ aggA += agg.a; aggB += agg.b; }
        else { aggA += agg.b; aggB += agg.a; }
      });
      tie.winner = aggA >= aggB ? tie.a : tie.b;
      const next = t.ko.rounds[ri + 1];
      if (next){
        if (ri === 0 && t.ko.rounds.length === 2) next.ties[0][ti === 0 ? 'a' : 'b'] = tie.winner;
        else if (ri === 0 && t.ko.rounds.length === 3) next.ties[ti].b = tie.winner;
        else if (ri === 1 && t.ko.rounds.length === 3) next.ties[0][ti === 0 ? 'a' : 'b'] = tie.winner;
        materializeKO(t);
      } else {
        t.completed = true;
        t.phase = 'done';
        t.winner = tie.winner;
        toast('🏆 ' + teamById(tie.winner).name + ' wins ' + t.name + '!', 'ok');
      }
    });
  });
}

function rebuildTournamentKO(tid) {
  const t = tourById(tid);
  if (!t || !t.ko) return;
  t.ko.rounds.forEach(r => r.ties.forEach(tie => { tie.winner = null; }));
  if (t.ko.rounds.length === 2) {
    t.ko.rounds[1].ties[0].a = null;
    t.ko.rounds[1].ties[0].b = null;
  } else if (t.ko.rounds.length === 3) {
    t.ko.rounds[1].ties[0].b = null;
    t.ko.rounds[1].ties[1].b = null;
    t.ko.rounds[2].ties[0].a = null;
    t.ko.rounds[2].ties[0].b = null;
  }
  t.completed = false;
  t.phase = 'knockout';
  t.winner = null;
  progressTournament(tid);
}

function roundRobinRounds(ids){
  const list = ids.slice();
  if (list.length % 2) list.push(null);
  const n = list.length;
  const rounds = [];
  for (let r = 0; r < n - 1; r++){
    const pairs = [];
    for (let i = 0; i < n / 2; i++){
      const a = list[i], b = list[n - 1 - i];
      if (a && b) pairs.push([a, b]);
    }
    rounds.push(pairs);
    list.splice(1, 0, list.pop());
  }
  return rounds;
}

function fixtureRoundNum(f){
  const m = String((f && f.round) || '').match(/(\d+)/);
  return m ? Number(m[1]) : 9000;
}

function sortedFixtures(list){
  const globalIdx = new Map(app.state.fixtures.map((f, i) => [f.id, i]));
  return list.slice().sort((a, b) => {
    const rd = fixtureRoundNum(a) - fixtureRoundNum(b);
    if (rd) return rd;
    const oa = (a.order !== undefined && a.order !== null) ? a.order : globalIdx.get(a.id);
    const ob = (b.order !== undefined && b.order !== null) ? b.order : globalIdx.get(b.id);
    if (oa !== ob) return oa - ob;
    return (globalIdx.get(a.id) || 0) - (globalIdx.get(b.id) || 0);
  });
}

function normalizeRound(roundName){
  const same = app.state.fixtures.filter(f => f.round === roundName && !f.tournamentId);
  const sorted = sortedFixtures(same);
  sorted.forEach((x, n) => { x.order = n; });
}

function moveFixture(id, dir){
  const f = fixtureById(id);
  if (!f || f.tournamentId) return false;
  const sameRound = app.state.fixtures.filter(x => x.round === f.round && !x.tournamentId);
  const sorted = sortedFixtures(sameRound);
  const i = sorted.findIndex(x => x.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= sorted.length) return false;
  [sorted[i], sorted[j]] = [sorted[j], sorted[i]];
  sorted.forEach((x, n) => { x.order = n; });
  return true;
}

      <div class="mc-header">
        <span>${esc(f.competition)} ${f.round ? `• ${esc(f.round)}` : ''}</span>
        <span>${f.legs} Leg${f.legs > 1 ? 's' : ''}</span>
      </div>
      <div class="mc-body">
        ${teamSide(A, 42)}
        <div class="mc-score">${score}</div>
        ${teamSide(B, 42, true)}
      </div>
      <div class="mc-footer">
        <span class="pill ${f.played ? 'li' : 'cy'}" style="font-size:9.5px">${f.played ? 'FINISHED' : 'PENDING'}</span>
        <div class="row" style="gap:6px">
          ${app.isAdmin && !f.played && !isTournament ? `
            <button class="btn sm" data-act="fixture:move" data-id="${f.id}" data-dir="-1" ${localI <= 0 ? 'disabled' : ''} title="Move up">↑</button>
            <button class="btn sm" data-act="fixture:move" data-id="${f.id}" data-dir="1" ${localI === roundFxs.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
            <button class="btn sm" data-act="fixture:edit" data-id="${f.id}" title="Edit">✏️</button>` : ''}
          ${app.isAdmin ? (
            f.played
              ? `<button class="btn sm" data-act="match:view" data-id="${f.matchId}">📊</button>
                 <button class="btn sm" data-act="match:edit" data-id="${f.matchId}">✏️</button>
                 <button class="btn sm danger" data-act="match:del" data-id="${f.matchId}">🗑️</button>`
              : `<button class="btn sm lime" data-act="track:open" data-id="${f.id}">▶️</button>
                 <button class="btn sm" data-act="match:record" data-id="${f.id}">📝</button>`
          ) : (f.played ? `<button class="btn sm" data-act="match:view" data-id="${f.matchId}">📊</button>` : '')}
          ${app.isAdmin && !isTournament ? `<button class="btn sm danger" data-act="fixture:del" data-id="${f.id}">🗑️</button>` : ''}
        </div>
      </div>
    </div>`;
  };
  let upHTML = '';
  if (!upcoming.length){
    upHTML = `<div class="empty"><span class="big">📭</span>No upcoming fixtures</div>`;
  } else {
    let lastRound = null, open = false;
    upcoming.forEach((f, i) => {
      if (f.round !== lastRound){
        if (open) upHTML += `</div>`;
        upHTML += `<div class="tiny" style="color:var(--pl-purple);letter-spacing:2px;text-transform:uppercase;margin:16px 0 10px;font-weight:900">${esc(f.round || 'No matchday')}</div><div class="grid g2">`;
        lastRound = f.round; open = true;
      }
      upHTML += fxRow(f, i, upcoming);
    });
    if (open) upHTML += `</div>`;
  }
  return `<div class="view-head">
    <h2><span class="emoji float">📅</span> Fixtures</h2>
    <div class="head-actions">
      ${app.isAdmin ? `
        <button class="btn lime" data-act="fixture:create"><span class="emoji">➕</span> Fixture</button>
        <button class="btn" data-act="fixture:autogen"><span class="emoji">🔁</span> Auto Fixtures</button>
        <button class="btn" data-act="report:open"><span class="emoji">📋</span> Paste Report</button>
        <button class="btn magenta" data-act="tournament:create"><span class="emoji">🏆</span> Tournament</button>
      ` : ''}
    </div>
  </div>
  <div class="section-title">Upcoming (${upcoming.length})</div>
  ${upHTML}
  <div class="section-title">Completed (${done.length})</div>
  <div class="grid g2">${done.length ? done.map((f, i) => fxRow(f, i, done)).join('') : '<div class="empty"><span class="big">🗂️</span>No completed fixtures</div>'}</div>`;
};

VIEWS.results = () => {
  const s = app.state;
  const ms = s.matches.slice().sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
  if (!ms.length) return `<div class="view-head"><h2><span class="emoji float">📊</span> Results</h2></div><div class="empty"><span class="big">🎯</span>No results recorded yet.</div>`;
  let html = `<div class="view-head"><h2><span class="emoji float">📊</span> Results <span class="muted small">(${ms.length})</span></h2></div><div class="grid g2">`;
  ms.forEach(m => {
    const A = teamById(m.teamAId), B = teamById(m.teamBId);
    const agg = matchAggregate(m);
    const mvp = m.mvpId ? playerById(m.mvpId) : null;
    const motm = m.motmId ? playerById(m.motmId) : null;
    const legsTxt = agg.legs.map(l => `${l.a}-${l.b}`).join(' • ');
    const scoreColor = agg.res === 'A' ? 'var(--lime)' : agg.res === 'B' ? 'var(--pl-pink)' : 'var(--gold)';
    html += `<div class="match-card anim">
      <div class="mc-header">
        <span>${new Date(m.timestamp || Date.now()).toLocaleDateString()}</span>
        <span>${agg.legs.length} Leg${agg.legs.length > 1 ? 's' : ''}</span>
      </div>
      <div class="mc-body">
        ${teamSide(A, 42)}
        <div class="mc-score" style="color:${scoreColor}">${agg.a} - ${agg.b}</div>
        ${teamSide(B, 42, true)}
      </div>
      <div class="mc-legs">${legsTxt || '—'}</div>
      ${(agg.penaltyA || agg.penaltyB) ? `<div class="tiny muted" style="margin-top:4px">🚫 Foul penalties: ${agg.penaltyA ? `${esc(A.name)} -${agg.penaltyA}` : ''}${agg.penaltyA && agg.penaltyB ? ' • ' : ''}${agg.penaltyB ? `${esc(B.name)} -${agg.penaltyB}` : ''}</div>` : ''}
      <div class="mc-footer">
        <div class="row" style="gap:6px">
          ${mvp ? `<span class="pill go tiny" title="MVP">🏅 ${playerLink(mvp)}</span>` : ''}
          ${motm ? `<span class="pill mg tiny" title="MOTM">⭐ ${playerLink(motm)}</span>` : ''}
        </div>
        <div class="row" style="gap:6px">
          <button class="btn sm" data-act="match:view" data-id="${m.id}">📊</button>
          ${app.isAdmin ? `<button class="btn sm" data-act="match:edit" data-id="${m.id}">✏️</button>
          <button class="btn sm danger" data-act="match:del" data-id="${m.id}">🗑️</button>` : ''}
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
};

VIEWS.standings = () => {
  const table = standingsSorted();
  if (!table.length) return `<div class="view-head"><h2><span class="emoji float">🏆</span> Standings</h2></div><div class="empty"><span class="big">📉</span>No standings yet.</div>`;
  const maxVal = Math.max(...table.map(t => t.value), 1);
  let html = `<div class="view-head"><h2><span class="emoji float">🏆</span> Standings</h2></div>`;
  html += `<div class="tblwrap"><table>
    <thead><tr>
      <th>#</th><th>Team</th><th class="num">MP</th><th class="num">W</th><th class="num">D</th><th class="num">L</th>
      <th class="num">GF</th><th class="num">GA</th><th class="num">GD</th><th class="num">PTS</th>
      <th>Form</th><th class="num">Treasury</th>
    </tr></thead><tbody>
    ${table.map((t, i) => {
      const form = t.form.slice(-5);
      return `<tr class="${i < 3 ? 'top' + (i + 1) : ''}">
        <td><span class="rk ${i === 0 ? 'rank1' : i === 1 ? 'rank2' : i === 2 ? 'rank3' : 'rk-D'}">${i+1}</span></td>
        <td>${teamLink(teamById(t.id), 22)}</td>
        <td class="num">${t.mp}</td><td class="num">${t.w}</td><td class="num">${t.d}</td><td class="num">${t.l}</td>
        <td class="num">${t.gf}</td><td class="num">${t.ga}</td>
        <td class="num" style="color:${t.gd > 0 ? '#059669' : t.gd < 0 ? '#dc2626' : 'var(--dim)'};font-weight:700">${t.gd > 0 ? '+' : ''}${t.gd}</td>
        <td class="num" style="color:var(--pl-purple);font-weight:900">${t.pts}</td>
        <td>${form.map(f => `<span class="badge b-${f}">${f}</span>`).join('')}</td>
        <td class="num" style="color:var(--pl-purple);font-weight:800">${money(t.value)}</td>
      </tr>`;
    }).join('')}
    </tbody></table></div>`;
  html += `<div class="section-title">Team Value Chart</div><div class="card anim">`;
  table.slice().sort((a,b) => b.value - a.value).forEach(t => {
    html += `<div style="margin-bottom:10px">
      <div class="between tiny" style="margin-bottom:4px">
        <span>${teamLink(teamById(t.id), 20)}</span>
        <b class="mono" style="color:var(--pl-purple)">${money(t.value)}</b>
      </div>
      <div class="bar"><span style="width:${Math.max(2, (t.value / maxVal) * 100)}%"></span></div>
    </div>`;
  });
  html += `</div>`;
  html += `<div class="section-title">Head-to-Head Matrix</div><div class="tblwrap"><table>
    <thead><tr><th>Team</th>${table.map(t => `<th class="num cl-name" data-act="team:view" data-id="${esc(t.id)}" title="Open ${esc(t.name)}">${esc(t.name.slice(0,3).toUpperCase())}</th>`).join('')}</tr></thead>
    <tbody>${table.map(a => `<tr><td class="nowrap">${teamLink(teamById(a.id), 20)}</td>${
      table.map(b => {
        if (a.id === b.id) return `<td class="num muted">—</td>`;
        const h = headToHead(a.id, b.id);
        return `<td class="num" title="${h.aWins}W ${h.draws}D ${h.bWins}L">${h.aGoals}:${h.bGoals}</td>`;
      }).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
  return html;
};

let playerSortKey = 'goals';
VIEWS.players = () => {
  const st = computePlayerStats();
  const q = (app._playerQuery || '').toLowerCase();
  const sorted = app.state.players.slice().filter(p =>
    !q || p.name.toLowerCase().includes(q) || (teamById(p.teamId).name || '').toLowerCase().includes(q)
  );
  sorted.sort((a,b) => {
    const sa = st[a.id] || {}, sb = st[b.id] || {};
    return (sb[playerSortKey] || 0) - (sa[playerSortKey] || 0);
  });
  const fmt = k => (k === 'playerValue' || k === 'marketValue' || k === 'growth') ? money : (v => v);
  let html = `<div class="view-head"><h2><span class="emoji float">🌟</span> Players</h2></div>
  <div class="card anim" style="margin-bottom:14px">
    <div class="field-row">
      <div><label class="fl">Search</label><input id="playerSearch" placeholder="Player or team..." value="${esc(app._playerQuery || '')}"></div>
      <div><label class="fl">Sort by</label>
        <select id="playerSort">
          ${[['goals','Goals'],['assists','Assists'],['saves','Saves'],['tackles','Tackles'],['playerValue','Player Value'],['marketValue','Market Value'],['mvp','MVP'],['motm','MOTM']]
            .map(([k,l]) => `<option value="${k}" ${playerSortKey === k ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
    </div>
  </div>`;
  if (!sorted.length) return html + `<div class="empty"><span class="big">🔍</span>No players found.</div>`;
  html += `<div class="tblwrap"><table>
    <thead><tr>
      <th>#</th><th>Player</th><th>Team</th>
      <th class="num">${playerSortKey.toUpperCase()}</th>
      <th class="num">G</th><th class="num">A</th><th class="num">S</th><th class="num">T</th>
      <th class="num">MVP</th><th class="num">Value</th>
    </tr></thead><tbody>`;
  sorted.forEach((p, i) => {
    const s = st[p.id] || {};
    const tm = teamById(p.teamId);
    const fa = p.freeAgent ? ' <span class="pill go tiny">FA</span>' : '';
    html += `<tr class="${i < 3 ? 'top' + (i + 1) : ''}">
      <td><span class="rk ${i === 0 ? 'rank1' : i === 1 ? 'rank2' : i === 2 ? 'rank3' : 'rk-D'}">${i+1}</span></td>
      <td>${playerLink(p, 'var(--pl-purple)')}${fa}</td>
      <td>${teamLink(tm, 20)}</td>
      <td class="num" style="color:var(--pl-purple);font-weight:900">${fmt(playerSortKey)(s[playerSortKey] || 0)}</td>
      <td class="num">${s.goals||0}</td><td class="num">${s.assists||0}</td>
      <td class="num">${s.saves||0}</td><td class="num">${s.tackles||0}</td>
      <td class="num">${s.mvp||0}</td>
      <td class="num" style="color:var(--pl-purple);font-weight:800">${money(s.playerValue)}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
};

VIEWS.teams = () => {
  const st = computePlayerStats();
  const standMap = computeStandings();
  const s = app.state;
  if (!s.teams.length) return `<div class="view-head"><h2><span class="emoji float">🛡️</span> Teams</h2></div><div class="empty"><span class="big">🛡️</span>No teams yet.</div>`;
  let html = `<div class="view-head"><h2><span class="emoji float">🛡️</span> Teams</h2></div><div class="grid g3">`;
  s.teams.forEach(t => {
    const roster = s.players.filter(p => p.teamId === t.id && isActivePlayer(p));
    const stt = standMap[t.id] || {};
    const avgVal = roster.length ? roster.reduce((a,p) => a + (st[p.id]?.playerValue||0), 0) / roster.length : 0;
    const top = roster.slice().sort((a,b) => (st[b.id]?.goals||0) - (st[a.id]?.goals||0))[0];
    html += `<div class="card clickable anim" data-act="team:view" data-id="${t.id}">
      <div class="row" style="margin-bottom:10px">${teamLogo(t, 44)}<b style="font-size:15px">${esc(t.name)}</b></div>
      <div class="kv"><span>Players</span><b>${roster.length}</b></div>
      <div class="kv"><span>Matches</span><b>${stt.mp||0}</b></div>
      <div class="kv"><span>Record</span><b>${stt.w||0}W ${stt.d||0}D ${stt.l||0}L</b></div>
      <div class="kv"><span>Points</span><b style="color:var(--pl-purple)">${stt.pts||0}</b></div>
      <div class="kv"><span>Avg player value</span><b style="color:var(--pl-purple)">${money(avgVal)}</b></div>
      <div class="kv"><span>Top scorer</span><b>${top ? playerLink(top) + ' (' + (st[top.id]?.goals||0) + ')' : '—'}</b></div>
      <div class="kv"><span>Treasury</span><b style="color:var(--pl-purple)">${money(t.value)}</b></div>
    </div>`;
  });
  html += `</div>`;
  return html;
};

VIEWS.teamprofile = () => {
  const t = teamById(app._teamViewId);
  if (!t || !app.state.teams.find(x => x.id === t.id))
    return `<div class="empty"><span class="big">❓</span>Team not found. <button class="btn sm" data-act="goto" data-view="teams">Back</button></div>`;
  const st = computePlayerStats();
  const standMap = computeStandings();
  const stt = standMap[t.id] || { mp:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0,form:[],comebacks:0,wall:0,best:0 };
  const roster = app.state.players.filter(p => p.teamId === t.id && isActivePlayer(p));
  const former = app.state.players.filter(p => {
    if (p.teamId === t.id && isActivePlayer(p)) return false;
    if (p.teamId === t.id && p.freeAgent) return true;
    return (p.transferHistory || []).some(h => h.from === t.id && h.to && h.to !== t.id);
  });
  const avgVal = roster.length ? roster.reduce((a,p) => a + (st[p.id]?.playerValue||0), 0) / roster.length : 0;
  const myMatches = app.state.matches.filter(m => m.teamAId === t.id || m.teamBId === t.id)
    .sort((a,b) => (b.timestamp||0) - (a.timestamp||0)).slice(0, 8);
  let html = `<div class="view-head">
    <h2 style="display:flex;align-items:center;gap:12px">${teamLogo(t, 44)} ${esc(t.name)}</h2>
    <div class="head-actions">
      <button class="btn sm" data-act="goto" data-view="teams">← Teams</button>
      ${app.isAdmin ? `<button class="btn sm gold" data-act="team:addfunds" data-id="${t.id}">💵 Add funds</button>
      <button class="btn sm" data-act="team:edit" data-id="${t.id}">✏️ Edit</button>` : ''}
    </div>
  </div>`;
  html += `<div class="grid g4">
    <div class="statbox"><div class="v">${stt.mp}</div><div class="l">Matches</div></div>
    <div class="statbox"><div class="v">${pct(stt.w, stt.mp)}</div><div class="l">Win rate</div></div>
    <div class="statbox"><div class="v" style="color:${stt.gd>=0?'#059669':'#dc2626'}">${stt.gd>0?'+':''}${stt.gd}</div><div class="l">Goal diff</div></div>
    <div class="statbox"><div class="v" style="color:var(--pl-purple)">${stt.pts}</div><div class="l">Points</div></div>
    <div class="statbox"><div class="v">${roster.length}</div><div class="l">Players</div></div>
    <div class="statbox"><div class="v" style="color:var(--pl-purple)">${money(avgVal)}</div><div class="l">Avg value</div></div>
    <div class="statbox"><div class="v" style="color:var(--pl-purple)">${money(t.value)}</div><div class="l">Treasury</div></div>
    <div class="statbox"><div class="v">${stt.wall||0}</div><div class="l">Wall (T+S)</div></div>
  </div>`;
  html += `<div class="section-title">Award Progress</div><div class="card anim">
    <div class="kv"><span>🔥 Comeback wins</span><b>${stt.comebacks||0}</b></div>
    <div class="kv"><span>⚡ Best win streak</span><b>${stt.best||0}</b></div>
    <div class="kv"><span>🧱 Tackles + Saves</span><b>${stt.wall||0}</b></div>
    <div class="kv"><span>🎯 Goals for / against</span><b>${stt.gf} / ${stt.ga}</b></div>
    <div class="kv"><span>📈 Recent form</span><b>${(stt.form||[]).slice(-5).map(f=>`<span class="badge b-${f}">${f}</span>`).join(' ') || '—'}</b></div>
  </div>`;
  html += `<div class="section-title">Recent Matches</div><div class="grid g2">`;
  if (!myMatches.length) html += `<div class="empty"><span class="big">📭</span>No matches yet.</div>`;
  myMatches.forEach(m => {
    const isA = m.teamAId === t.id;
    const opp = teamById(isA ? m.teamBId : m.teamAId);
    const agg = matchAggregate(m);
    const my = isA ? agg.a : agg.b, their = isA ? agg.b : agg.a;
    const res = my > their ? 'W' : my < their ? 'L' : 'D';
    html += `<div class="card anim" style="padding:12px">
      <div class="between">
        <span class="badge b-${res}">${res}</span>
        <b>${my} - ${their}</b>
        <span class="muted small">vs ${teamLink(opp, 20)}</span>
        <button class="btn sm" data-act="match:view" data-id="${m.id}">📊</button>
      </div>
    </div>`;
  });
  html += `</div>`;
  html += `<div class="section-title">Full Roster</div><div class="tblwrap"><table>
    <thead><tr><th>Player</th><th class="num">MP</th><th class="num">G</th><th class="num">A</th><th class="num">S</th><th class="num">T</th>
    <th class="num">MVP</th><th class="num">MOTM</th><th class="num">Start</th><th class="num">Growth</th><th class="num">Value</th>${app.isAdmin ? '<th></th>' : ''}</tr></thead>
    <tbody>${roster.length ? roster.map(p => {
      const s = st[p.id] || {};
      return `<tr>
        <td>${playerLink(p, 'var(--pl-purple)')}</td>
        <td class="num">${s.matches||0}</td>
        <td class="num">${s.goals||0}</td><td class="num">${s.assists||0}</td>
        <td class="num">${s.saves||0}</td><td class="num">${s.tackles||0}</td>
        <td class="num">${s.mvp||0}</td><td class="num">${s.motm||0}</td>
        <td class="num">${money(s.startingValue)}</td>
        <td class="num" style="color:#059669;font-weight:700">+${money(s.growth)}</td>
        <td class="num" style="color:var(--pl-purple);font-weight:900">${money(s.playerValue)}</td>
        ${app.isAdmin ? `<td class="nowrap">
          <button class="btn sm" data-act="player:edit" data-id="${p.id}" title="Edit">✏️</button>
          <button class="btn sm lime" data-act="player:release" data-id="${p.id}" title="Release as free agent">🟡</button>
        </td>` : ''}
      </tr>`;
    }).join('') : `<tr><td colspan="${app.isAdmin ? 12 : 11}" class="center muted" style="padding:16px">No players</td></tr>`}</tbody>
  </table></div>`;
  if (former.length){
    html += `<div class="section-title">Former &amp; Free Agents</div><div class="card anim">
      ${former.map(p => {
        const s = st[p.id] || {};
        const status = p.freeAgent ? '<span class="pill go">🟡 FREE AGENT</span>' : '<span class="pill cy">MOVED</span>';
        const moved = (p.transferHistory || []).filter(h => h.from === t.id && h.to && h.to !== t.id).slice(-1)[0];
        const dest = moved ? ' · to ' + esc(teamById(moved.to).name) : '';
        return `<div class="kv">
          <span>${playerLink(p)} ${status}</span>
          <b class="small muted">${s.goals||0}G ${s.assists||0}A ${s.saves||0}S ${s.tackles||0}T · ${money(s.playerValue)}${dest}</b>
        </div>`;
      }).join('')}
    </div>`;
  }
  return html;
};

    const t = tourById(app._tourViewId);

function teamOfTheSeason(){
  const st = computePlayerStats();
  const pool = app.state.players.map(p => ({ p, s: st[p.id] || {} }));
  const pick = keys => {
    let best = null;
    pool.forEach(x => {
      if (!best){ best = x; return; }
      for (let i = 0; i < keys.length; i++){
        const d = (+x.s[keys[i]] || 0) - (+best.s[keys[i]] || 0);
        if (d > 0){ best = x; return; }
        if (d < 0) return;
      }
    });
    return (best && (+best.s[keys[0]] || 0) > 0) ? best : null;
  };
  return [
    { slot:'ST',  icon:'⚽', role:'Striker',    key:'goals',   unit:'Goals',   row: pick(['goals','assists','tackles','saves']) },
    { slot:'CAM', icon:'🎯', role:'Playmaker',  key:'assists', unit:'Assists', row: pick(['assists','goals','tackles','saves']) },
    { slot:'CB',  icon:'🛡️', role:'Defender',   key:'tackles', unit:'Tackles', row: pick(['tackles','saves','goals','assists']) },
    { slot:'GK',  icon:'🧤', role:'Goalkeeper', key:'saves',   unit:'Saves',   row: pick(['saves','tackles','goals','assists']) }
  ];
}

function renderNav(){
  const nav = $('#nav');
  let html = NAV_ITEMS.map(([v, ic, label]) =>
    `<button class="navbtn ${app.currentView === v ? 'active' : ''}" data-act="goto" data-view="${v}">
      <span class="emoji">${ic}</span>${label}</button>`).join('');
  if (app.isAdmin){
    html += `<button class="navbtn admin ${app.currentView === 'logs' ? 'active' : ''}" data-act="goto" data-view="logs"><span class="emoji">🧾</span>Logs</button>`;
  }
  html += app.isAdmin
    ? `<button class="navbtn ghost" data-act="logout"><span class="emoji">🚪</span>Logout</button>`
    : `<button class="navbtn ghost" data-act="login"><span class="emoji">🔐</span>Admin Login</button>`;
  nav.innerHTML = html;
  $('#brandName').textContent = app.state.leagueName;
  $('#seasonChip').textContent = app.state.seasonName;
  const chip = $('#userChip');
  if (app.user){
    chip.style.display = '';
    chip.textContent = '👑 ADMIN';
  } else chip.style.display = 'none';
}

function render(){
  rebuildHypeCountMap();
  renderNav();
  const fn = VIEWS[app.currentView] || VIEWS.registry;
  let out;
  try { out = fn(); }
  catch(e){ console.error(e); out = `<div class="empty"><span class="big">💥</span>Render error: ${esc(e.message)}</div>`; }
  $('#view').innerHTML = out;
  if (window.anime){
    anime({
      targets: '#view .anim, #view .card, #view .statbox',
      translateY: [16, 0], opacity: [0, 1],
      delay: anime.stagger(24), duration: 480, easing: 'easeOutCubic'
    });
  }
}

function go(view){

        <div class="modal-head"><h3>${title}</h3><button class="x" data-act="modal:close">✕</button></div>
        <div class="modal-body" id="modalBody">${body}</div>
        ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
      </div>
    </div>`;
  $('#modalRoot').classList.add('open');
}
function closeModal(){ $('#modalRoot').innerHTML = ''; $('#modalRoot').classList.remove('open'); app._draft = null; app._activePlayerProfileId = null; }
function reModal(body){ const b = $('#modalBody'); if (b) b.innerHTML = body; }

function parsePlayerLines(text){ return String(text || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean); }
function playerNameKey(name){
  let value = String(name || '').trim();
  if (value.normalize) value = value.normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
  return value.toLowerCase().replace(/\s+/g, ' ');
}
function findDuplicatePlayers(name){
  const key = playerNameKey(name);
  if (!key) return [];
  return app.state.players.filter(p => playerNameKey(p.name) === key);
}

const RP_SCORE  = /^(.+?)\s+(\d+)\s*[-–—:]\s*(\d+)\s+(.+)$/;
const RP_VS     = /^(.+?)\s+(?:vs\.?|versus|v)\s+(.+)$/i;
const RP_LEG_A  = /^(?:leg|round)\s*(\d+)\s*[:.]?\s*(?:(\d+)\s*[-–—:]\s*(\d+))?$/i;
const RP_LEG_B  = /^(\d+)(?:st|nd|rd|th)?\s*leg\s*[:.]?\s*(?:(\d+)\s*[-–—:]\s*(\d+))?$/i;
const RP_TOKENS = /^(.+?)\s+((?:\d+\s*[gast]\s*)+)$/i;
const RP_BARE   = /^(.+?)\s+(\d+)\s+(\d+)(?:\s+(\d+))?(?:\s+(\d+))?$/;
const RP_AWARD  = /^(mvp|motm)\s*:?\s*(.+)$/i;

function rpNorm(s){
  let out = String(s || '');
  if (out.normalize) out = out.normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
  return out.toLowerCase().replace(/[^a-z0-9\u0400-\u04FF]+/g, ' ').trim().replace(/\s+/g, ' ');
}

function rpDistance(a, b){
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = [];
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++){
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
    }
    prev = cur;
  }
  return prev[n];
}

function rpScore(query, candidate){
  if (!query || !candidate) return -1;
  if (query === candidate) return 100;
  if (candidate.indexOf(query) === 0 || query.indexOf(candidate) === 0) return 80 - Math.abs(candidate.length - query.length);
  if (query.length >= 3 && candidate.indexOf(query) > -1) return 60;
  const d = rpDistance(query, candidate);
  const max = Math.max(1, Math.floor(Math.max(query.length, candidate.length) / 4));
  return d <= max ? 50 - d : -1;
}

function rpMatchPlayer(players, typed){
  const q = rpNorm(typed);
  if (!q) return null;
  let best = null, bestScore = -1, tie = false;
  players.forEach(p => {
    const keys = [rpNorm(p.name)].concat((p.aliases || []).map(rpNorm));
    keys.forEach(k => {
      const sc = rpScore(q, k);
      if (sc > bestScore){ bestScore = sc; best = p; tie = false; }
      else if (sc === bestScore && sc > 0 && p !== best){ tie = true; }
    });
  });
  return (best && bestScore > 0 && !tie) ? best : null;
}

function rpMatchTeam(name){
  const q = rpNorm(name);
  if (!q) return null;
  let best = null, bestScore = -1;
  app.state.teams.forEach(t => {
    const keys = [rpNorm(t.name)].concat((t.aliases || []).map(rpNorm));
    keys.forEach(k => {
      const sc = rpScore(q, k);
      if (sc > bestScore){ bestScore = sc; best = t; }
    });
  });
  return bestScore > 0 ? best : null;
}

function rpFindTeam(name){ return rpMatchTeam(name); }
function rpFindPlayer(teamIds, name){
  const pool = app.state.players.filter(p => teamIds.indexOf(p.teamId) > -1);
  return rpMatchPlayer(pool, name) || rpMatchPlayer(app.state.players, name);
}

function rpNewMatch(round, aName, bName){
  return { round, teamAName: aName, teamBName: bName, legs: [], curLeg: 0, mvpName: '', motmName: '', warnings: [] };
}
function rpEnsureLeg(m, idx){
  idx = Math.max(0, Math.min(3, idx));
  while (m.legs.length <= idx) m.legs.push({ a: null, b: null, given: false, players: [] });
  m.curLeg = idx;
  return m.legs[idx];
}
function rpDeriveLeg(m, leg){
  let a = 0, b = 0;
  leg.players.forEach(p => {
    if (!p.player) return;
    if (m.teamA && p.player.teamId === m.teamA.id) a += p.goals || 0;
    else if (m.teamB && p.player.teamId === m.teamB.id) b += p.goals || 0;
  });
  leg.a = a; leg.b = b;
}
function rpDeriveAgg(m){
  m.aggA = m.legs.reduce((n, l) => n + (l.a || 0), 0);
  m.aggB = m.legs.reduce((n, l) => n + (l.b || 0), 0);
}

function parseReportText(text){
  const lines = String(text || '').split(/\r?\n/).map(l => l.replace(/[*_`]/g, '').trim());
  const matches = [];
  let round = '', cur = null;
  for (const line of lines){
    if (!line) continue;
    const aw = line.match(RP_AWARD);
    if (aw && cur){
      if (aw[1].toLowerCase() === 'mvp') cur.mvpName = aw[2].trim();
      else cur.motmName = aw[2].trim();
      continue;
    }
    const lg = line.match(RP_LEG_A) || line.match(RP_LEG_B);
    if (lg && cur){
      const leg = rpEnsureLeg(cur, Number(lg[1]) - 1);
      if (lg[2] !== undefined && lg[2] !== null){
        leg.a = Number(lg[2]); leg.b = Number(lg[3]); leg.given = true;
      }
      continue;
    }
    const sc = line.match(RP_SCORE);
    if (sc){
      const aName = sc[1].trim(), bName = sc[4].trim();
      const samePair = cur && cur.legs.length === 0 &&
        rpNorm(cur.teamAName) === rpNorm(aName) && rpNorm(cur.teamBName) === rpNorm(bName);
      if (!samePair){ cur = rpNewMatch(round, aName, bName); matches.push(cur); }
      const leg = rpEnsureLeg(cur, 0);
      leg.a = Number(sc[2]); leg.b = Number(sc[3]); leg.given = true;
      continue;
    }
    const vs = line.match(RP_VS);
    if (vs){ cur = rpNewMatch(round, vs[1].trim(), vs[2].trim()); matches.push(cur); continue; }
    const tk = line.match(RP_TOKENS);
    if (tk && cur){
      const st = { name: tk[1].trim(), goals: 0, assists: 0, saves: 0, tackles: 0 };
      const re = /(\d+)\s*([gastf])/gi;
      let hit;
      while ((hit = re.exec(tk[2]))){
        const v = Number(hit[1]); const k = hit[2].toLowerCase();
        if (k === 'g') st.goals += v; else if (k === 'a') st.assists += v;
        else if (k === 's') st.saves += v; else st.tackles += v;
      }
      rpEnsureLeg(cur, cur.curLeg).players.push(st);
      continue;
    }
    const br = line.match(RP_BARE);
    if (br && cur){
      rpEnsureLeg(cur, cur.curLeg).players.push({
        name: br[1].trim(), goals: Number(br[2]) || 0, assists: Number(br[3]) || 0,
        saves: Number(br[4]) || 0, tackles: Number(br[5]) || 0
      });
      continue;
    }
    if (!cur){ round = line; continue; }
    cur.warnings.push('Ignored: "' + line.slice(0, 50) + '"');
  }
  matches.forEach((m, mi) => {
    m.index = mi;
    m.teamA = rpFindTeam(m.teamAName);
    m.teamB = rpFindTeam(m.teamBName);
    if (!m.teamA) m.warnings.push('Unknown team: ' + m.teamAName);
    if (!m.teamB) m.warnings.push('Unknown team: ' + m.teamBName);
    m.teamIds = [m.teamA && m.teamA.id, m.teamB && m.teamB.id].filter(Boolean);
    if (!m.legs.length) rpEnsureLeg(m, 0);
    m.legs.forEach((leg, li) => {
      leg.index = li;
      leg.players.forEach((p, pi) => {
        p.index = pi; p.leg = li;
        if (!p.manual) p.player = rpFindPlayer(m.teamIds, p.name);
        if (!p.player) m.warnings.push('Unknown player: ' + p.name);
      });
      if (!leg.given) rpDeriveLeg(m, leg);
    });
    rpDeriveAgg(m);
    m.players = [];
    m.legs.forEach(l => l.players.forEach(p => m.players.push(p)));
  });
  return { matches };
}

function importReportMatches(parsed){
  const created = [];
  parsed.matches.forEach((pm, idx) => {
    if (!pm.teamA || !pm.teamB || pm.teamA.id === pm.teamB.id) return;
    if (!pm.legs.length) return;
    let f = app.state.fixtures.find(x => !x.played && !x.tournamentId &&
      ((x.teamAId === pm.teamA.id && x.teamBId === pm.teamB.id) ||
       (x.teamAId === pm.teamB.id && x.teamBId === pm.teamA.id)));
    if (!f){
      f = {
        id: uuid(), teamAId: pm.teamA.id, teamBId: pm.teamB.id,
        competition: 'League', round: pm.round || 'Imported',
        date: '', legs: pm.legs.length, played: false, stage: 'friendly', tournamentId: null, group: null
      };
      app.state.fixtures.push(f);
    }
    f.legs = pm.legs.length;
    const blank = () => ({ played: false, goals: 0, assists: 0, saves: 0, tackles: 0 });
    const stats = {};
    pm.legs.forEach((leg, li) => {
      leg.players.forEach(p => {
        if (!p.player) return;
        const id = p.player.id;
        if (!stats[id]) stats[id] = pm.legs.map(blank);
        const slot = stats[id][li];
        slot.played = true;
        slot.goals += p.goals || 0;
        slot.assists += p.assists || 0;
        slot.saves += p.saves || 0;
        slot.tackles += p.tackles || 0;
        const norm = rpNorm(p.name);
        const known = [rpNorm(p.player.name)].concat((p.player.aliases || []).map(rpNorm));
        if (norm && known.indexOf(norm) === -1){
          p.player.aliases = (p.player.aliases || []).filter(a => rpNorm(a) !== norm).slice(-9).concat(p.name);
        }
      });
    });
    const contrib = pid => stats[pid].reduce((n, l) => n + l.goals * 5 + l.assists * 3 + l.saves + l.tackles * 0.5, 0);
    const ranked = Object.keys(stats).map(pid => ({ pid, v: contrib(pid) })).sort((a, b) => b.v - a.v);
    const byName = name => name ? rpFindPlayer([pm.teamA.id, pm.teamB.id], name) : null;
    const mvpP = byName(pm.mvpName) || (ranked[0] && playerById(ranked[0].pid)) || null;
    const motmP = byName(pm.motmName) || (ranked[1] && playerById(ranked[1].pid)) || mvpP;
    const m = {
      id: uuid(), teamAId: pm.teamA.id, teamBId: pm.teamB.id, fixtureId: f.id,
      timestamp: Date.now() + idx,
      mvpId: mvpP ? mvpP.id : null, motmId: motmP ? motmP.id : null,
      mvpSnapshot: mvpP ? { name: mvpP.name, teamId: mvpP.teamId } : null,
      motmSnapshot: motmP ? { name: motmP.name, teamId: motmP.teamId } : null,
      playerStats: stats, playerTeams: {}, fouls: []
    };
    Object.keys(stats).forEach(pid => {
      const p = playerById(pid);
      if (p) m.playerTeams[pid] = p.teamId;
    });
    for (let i = 1; i <= 4; i++){
      if (i <= pm.legs.length){ m['leg' + i + 'ScoreA'] = pm.legs[i - 1].a; m['leg' + i + 'ScoreB'] = pm.legs[i - 1].b; }
      else { m['leg' + i + 'ScoreA'] = null; m['leg' + i + 'ScoreB'] = null; }
    }
    applyMatchToState(m, f);
    created.push(m);
  });
  return created;
}

function renderReportPreview(parsed){
  const box = $('#reportPreview');

  if (!parsed || app._reportText !== text){ parsed = parseReportText(text); app._reportText = text; }

  if (!parsed.matches.length){ box.innerHTML = `<div class="empty" style="padding:14px">Nothing recognised yet.</div>`; return; }

  parsed.matches.forEach(m => {
    const tA = m.teamA ? esc(m.teamA.name) : `<span style="color:var(--red)">${esc(m.teamAName)}?</span>`;
    const tB = m.teamB ? esc(m.teamB.name) : `<span style="color:var(--red)">${esc(m.teamBName)}?</span>`;
    const missing = m.players.filter(p => !p.player).length;

    h += `<div class="rp-match">
      <div class="between">
        <b>${tA} <span style="color:var(--pl-purple)">${m.aggA} - ${m.aggB}</span> ${tB}</b>

      </div>`;
    m.legs.forEach(leg => {
      const miss = leg.players.filter(p => !p.player);
      h += `<div style="margin-top:8px">
        <div class="tiny" style="color:var(--pl-purple);letter-spacing:1.2px;font-weight:800">LEG ${leg.index + 1} <span style="color:var(--pl-pink)">${leg.a} - ${leg.b}</span></div>
        ${leg.players.filter(p => p.player).length ? `<div class="row" style="gap:5px;margin-top:5px">${leg.players.filter(p => p.player).map(p => {
          const differs = rpNorm(p.player.name) !== rpNorm(p.name);
          return `<span class="pill cy" title="${esc(p.player.name)}">${esc(p.name)}${differs ? ' → ' + esc(p.player.name) : ''} ${p.goals}G ${p.assists}A ${p.saves}S ${p.tackles}T</span>`;
        }).join('')}</div>` : ''}
        ${miss.length ? `<div style="margin-top:5px">${miss.map(p => `
          <div class="row" style="gap:6px;margin-top:4px">
            <span class="pill go">${esc(p.name)}</span>
            <span class="tiny muted">not found, pick:</span>
            <select data-rp-fix="${m.index}:${leg.index}:${p.index}" style="width:auto;flex:1;max-width:240px;padding:4px 6px;font-size:11px">
              <option value="">skip this player</option>
              ${pool.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}
            </select>
          </div>`).join('')}</div>` : ''}
      </div>`;
    });
    h += `${m.warnings.length ? `<div class="tiny" style="color:#b45309;margin-top:7px;font-weight:600">${m.warnings.map(esc).join(' • ')}</div>` : ''}</div>`;
  });
  box.innerHTML = h;
}

function trackStart(fixtureId){
  const f = fixtureById(fixtureId);
  if (!f) return;
  const legs = Math.max(1, Math.min(4, Number(f.legs) || 1));
  const st = {
    fixtureId: f.id, legs, leg: 1,
    scores: Array.from({ length: legs }, () => ({ a: 0, b: 0 })),
    touched: Array.from({ length: legs }, () => false),
    sel: {}, mvpId: '', motmId: '', stats: {}, fouls: []
  };
  app.state.players
    .filter(p => (p.teamId === f.teamAId || p.teamId === f.teamBId) && isActivePlayer(p))
    .forEach(p => {
      st.stats[p.id] = Array.from({ length: legs }, () => ({ g: 0, a: 0, s: 0, t: 0 }));
    });
  app._track = st;
  app._trackUndo = [];
  openModal('⚡ Match Tracker', trackBodyHTML(),
    `<button class="btn" data-act="track:undo">↩️ Undo</button>
     <button class="btn" data-act="track:reset">🧹 Reset leg</button>
     <button class="btn" data-act="track:copy">📋 Copy</button>
     <button class="btn lime" data-act="track:save">💾 Save match</button>`);
  renderTrack();
}

function trackTotals(){
  const st = app._track;
  const out = { a: 0, b: 0 };
  if (!st) return out;
  st.scores.forEach(s => { out.a += s.a; out.b += s.b; });
  return out;
}

function trackBodyHTML(){
  const st = app._track;
  if (!st) return '';
  const f = fixtureById(st.fixtureId);
  if (!f) return '<div class="empty">Fixture not found</div>';
  const A = teamById(f.teamAId), B = teamById(f.teamBId);
  const i = st.leg - 1;
  const sc = st.scores[i];
  const all = trackTotals();
  const penaltyA = matchFoulPenalty({ fouls: st.fouls }, f.teamAId);
  const penaltyB = matchFoulPenalty({ fouls: st.fouls }, f.teamBId);
  const adjustedA = Math.max(0, all.a - penaltyA);
  const adjustedB = Math.max(0, all.b - penaltyB);
  const row = p => {
    const s = st.stats[p.id] && st.stats[p.id][i] || { g:0, a:0, s:0, t:0 };
    const picked = !!(st.sel && st.sel[p.id]);
    const chip = (k, icon, label) =>
      `<button class="trk-chip ${s[k] ? 'on' : ''} ${picked ? '' : 'off'}" data-act="track:inc" data-pid="${p.id}" data-k="${k}" title="${label}">${icon} ${s[k]}</button>`;
    return `<div class="trk-row">
      <label class="trk-play" title="Tick him if he played"><input type="checkbox" data-trk-play="${p.id}" ${picked ? 'checked' : ''}></label>
      <span class="trk-name ${picked ? '' : 'out'}">${esc(p.name)}</span>
      ${chip('g', '⚽', 'Goal')}${chip('a', '🅰️', 'Assist')}${chip('s', '🧤', 'Save')}${chip('t', '🛡️', 'Tackle')}
    </div>`;
  };
  const side = team => {
    const roster = app.state.players.filter(p => p.teamId === team.id && isActivePlayer(p));
    return `<div class="trk-team">
      <div class="trk-team-head">
        ${teamLogo(team, 24)}<b>${esc(team.name)}</b>
        <button class="trk-mini" data-act="track:all" data-team="${team.id}" data-mode="all">all</button>
        <button class="trk-mini" data-act="track:all" data-team="${team.id}" data-mode="none">none</button>
      </div>
      ${roster.length ? roster.map(row).join('') : '<div class="muted small">No players in this team</div>'}
    </div>`;
  };
  const pool = app.state.players.filter(p => (p.teamId === f.teamAId || p.teamId === f.teamBId) && isActivePlayer(p) && st.sel[p.id]);
  const awardOpts = sel => `<option value="">auto</option>` + pool.map(p =>
    `<option value="${p.id}" ${sel === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  return `<div class="trk-score">
    <span class="trk-side">${teamLogo(A, 34)}<b>${esc(A.name)}</b></span>
    <span class="trk-num">${sc.a} - ${sc.b}</span>
    <span class="trk-side">${teamLogo(B, 34)}<b>${esc(B.name)}</b></span>
  </div>
  ${st.legs > 1 ? `<div class="center tiny muted" style="margin-bottom:8px">Raw aggregate ${all.a} - ${all.b}</div>
  <div class="legtab" style="justify-content:center">${Array.from({ length: st.legs }, (_, n) =>
    `<button class="${st.leg === n + 1 ? 'on' : ''}" data-act="track:leg" data-leg="${n + 1}">Leg ${n + 1}</button>`).join('')}</div>` : ''}
  ${(penaltyA || penaltyB) ? `<div class="center tiny" style="color:#dc2626;margin:0 0 8px;font-weight:700">Final score after foul penalties: <b>${adjustedA} - ${adjustedB}</b></div>` : ''}
  <div class="trk-cols">${side(A)}${side(B)}</div>
  <div class="field-row" style="margin-top:12px">
    <div><label class="fl">🏅 MVP</label><select data-trk-award="mvp" style="padding:6px 8px;font-size:12px">${awardOpts(st.mvpId)}</select></div>
    <div><label class="fl">⭐ MOTM</label><select data-trk-award="motm" style="padding:6px 8px;font-size:12px">${awardOpts(st.motmId)}</select></div>
  </div>
  ${foulEditorHTML(st.fouls, f.teamAId, f.teamBId, 'track')}
  <div class="tiny muted" style="margin-top:10px;text-align:center">Tick players who played, or just tap a stat and he ticks himself. Undo takes back the last tap.</div>`;
}

function trackIncrement(pid, k){
  const st = app._track;
  if (!st || !st.stats[pid]) return;
  st.sel[pid] = true;
  const i = st.leg - 1;
  st.touched[i] = true;
  const l = st.stats[pid][i];
  l[k] = (l[k] || 0) + 1;
  const p = playerById(pid);
  const f = fixtureById(st.fixtureId);
  if (k === 'g' && p && f){
    if (p.teamId === f.teamAId) st.scores[i].a++;
    else if (p.teamId === f.teamBId) st.scores[i].b++;
  }
  app._trackUndo = (app._trackUndo || []).concat([{ pid, k, leg: st.leg }]);
  renderTrack();
}

function trackUndo(){
  const undo = app._trackUndo || [];
  const last = undo.pop();
  app._trackUndo = undo;
  if (!last) return;
  const st = app._track;
  const l = st.stats[last.pid] && st.stats[last.pid][last.leg - 1];
  if (!l) return;
  l[last.k] = Math.max(0, (l[last.k] || 0) - 1);
  const p = playerById(last.pid);
  const f = fixtureById(st.fixtureId);
  if (last.k === 'g' && p && f){
    const i = last.leg - 1;
    if (p.teamId === f.teamAId) st.scores[i].a = Math.max(0, st.scores[i].a - 1);
    else st.scores[i].b = Math.max(0, st.scores[i].b - 1);
  }
  renderTrack();
}

function trackResetLeg(){
  const st = app._track;
  if (!st) return;
  const i = st.leg - 1;
  Object.keys(st.stats).forEach(pid => { st.stats[pid][i] = { g:0, a:0, s:0, t:0 }; });
  st.scores[i] = { a: 0, b: 0 };
  st.touched[i] = false;
  app._trackUndo = (app._trackUndo || []).filter(u => u.leg !== st.leg);
  renderTrack();
}

function trackSetSelected(pid, picked){
  const st = app._track;
  if (!st) return;
  st.sel = st.sel || {};
  if (picked){ st.sel[pid] = true; }
  else {
    delete st.sel[pid];
    if (st.stats[pid]) st.stats[pid] = st.stats[pid].map(() => ({ g:0, a:0, s:0, t:0 }));
    app._trackUndo = (app._trackUndo || []).filter(u => u.pid !== pid);
    if (st.mvpId === pid) st.mvpId = '';
    if (st.motmId === pid) st.motmId = '';
    trackRecomputeScores();
  }
  renderTrack();
}

function trackSelectTeam(teamId, mode){
  const st = app._track;
  if (!st) return;
  const roster = app.state.players.filter(p => p.teamId === teamId && isActivePlayer(p));
  if (mode === 'all'){
    roster.forEach(p => { st.sel[p.id] = true; });
  } else {
    roster.forEach(p => {
      delete st.sel[p.id];
      if (st.stats[p.id]) st.stats[p.id] = st.stats[p.id].map(() => ({ g:0, a:0, s:0, t:0 }));
      if (st.mvpId === p.id) st.mvpId = '';
      if (st.motmId === p.id) st.motmId = '';
    });
    app._trackUndo = (app._trackUndo || []).filter(u => !roster.some(p => p.id === u.pid));
    trackRecomputeScores();
  }
  renderTrack();
}

function trackRecomputeScores(){
  const st = app._track;
  if (!st) return;
  const f = fixtureById(st.fixtureId);
  if (!f) return;
  st.scores = st.scores.map(() => ({ a: 0, b: 0 }));
  Object.keys(st.stats).forEach(pid => {
    const p = playerById(pid);
    if (!p) return;
    st.stats[pid].forEach((l, li) => {
      if (!st.scores[li]) return;
      if (p.teamId === f.teamAId) st.scores[li].a += l.g || 0;
      else if (p.teamId === f.teamBId) st.scores[li].b += l.g || 0;
    });
  });
}

function trackResultText(){
  const st = app._track;
  if (!st) return '';
  const f = fixtureById(st.fixtureId);
  const A = teamById(f.teamAId), B = teamById(f.teamBId);
  const all = trackTotals();
  const fouls = normalizeMatchFouls(st.fouls, f.teamAId, f.teamBId);
  const penaltyA = matchFoulPenalty({ fouls }, f.teamAId);
  const penaltyB = matchFoulPenalty({ fouls }, f.teamBId);
  const finalA = Math.max(0, all.a - penaltyA);
  const finalB = Math.max(0, all.b - penaltyB);
  const lines = [`${A.name} ${finalA} - ${finalB} ${B.name}`];
  if (fouls.length){
    lines.push(`Raw score before fouls: ${all.a} - ${all.b}`);
    fouls.forEach(foul => lines.push(`FOUL — ${teamById(foul.teamId)?.name || 'Unknown team'}: ${foul.description} (-${foul.points})`));
  }
  Object.keys(st.stats).forEach(pid => {
    const p = playerById(pid);
    if (!p) return;
    if (!st.sel || !st.sel[pid]) return;
    const t = st.stats[pid].reduce((n, l) => ({
      g: n.g + l.g, a: n.a + l.a, s: n.s + l.s, k: n.k + l.t
    }), { g:0, a:0, s:0, k:0 });
    if (t.g || t.a || t.s || t.k) lines.push(`${p.name} ${t.g}G ${t.a}A ${t.s}S ${t.k}T`);
  });
  return lines.join('\n');
}

function trackCopy(){
  const text = trackResultText();
  if (!text) return;
  const done = () => toast('📋 Result copied', 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => trackCopyFallback(text, done));
  } else trackCopyFallback(text, done);
}

function trackCopyFallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ toast('❌ Could not copy', 'err'); }
  ta.remove();
}

async function trackSave(){
  const st = app._track;
  if (!st) return;
  const f = fixtureById(st.fixtureId);
  if (!f){ closeModal(); return; }
  const touched = st.touched || [];
  let usedLegs = 1;
  touched.forEach((t, i) => { if (t) usedLegs = Math.max(usedLegs, i + 1); });
  usedLegs = Math.max(1, Math.min(st.legs, usedLegs));
  if (!Object.keys(st.sel || {}).length){
    return toast('⚠️ Tick at least one player first', 'err');
  }
  const stats = {};
  Object.keys(st.stats).forEach(pid => {
    const picked = !!(st.sel && st.sel[pid]);
    stats[pid] = st.stats[pid].slice(0, usedLegs).map(l => ({
      played: picked, goals: l.g || 0, assists: l.a || 0, saves: l.s || 0, tackles: l.t || 0
    }));
  });
  const contrib = pid => stats[pid].reduce((n, l) =>
    n + l.goals * 5 + l.assists * 3 + l.saves + l.tackles * 0.5, 0);
  const ranked = Object.keys(stats).map(pid => ({ pid, v: contrib(pid) })).sort((a, b) => b.v - a.v);
  const autoMvp = ranked[0] && ranked[0].v > 0 ? ranked[0].pid : null;
  const autoMotm = ranked[1] && ranked[1].v > 0 ? ranked[1].pid : autoMvp;
  const mvpId = st.mvpId || autoMvp;
  const motmId = st.motmId || autoMotm;
  const m = {
    id: uuid(), teamAId: f.teamAId, teamBId: f.teamBId, fixtureId: f.id,
    timestamp: Date.now(), mvpId, motmId,
    mvpSnapshot: mvpId ? (() => { const p = playerById(mvpId); return p ? { name: p.name, teamId: p.teamId } : null; })() : null,
    motmSnapshot: motmId ? (() => { const p = playerById(motmId); return p ? { name: p.name, teamId: p.teamId } : null; })() : null,
    playerStats: stats, playerTeams: {}, fouls: normalizeMatchFouls(st.fouls, f.teamAId, f.teamBId)
  };
  Object.keys(stats).forEach(pid => {
    const p = playerById(pid);
    if (p) m.playerTeams[pid] = p.teamId;
  });
  for (let i = 1; i <= 4; i++){
    if (i <= usedLegs){
      m['leg' + i + 'ScoreA'] = st.scores[i - 1].a;
      m['leg' + i + 'ScoreB'] = st.scores[i - 1].b;
    } else { m['leg' + i + 'ScoreA'] = null; m['leg' + i + 'ScoreB'] = null; }
  }
  f.legs = usedLegs;
  applyMatchToState(m, f);
  app._track = null;
  app._trackUndo = [];
  await logAdmin('Tracked a match result');
  await saveState(); closeModal(); render();
  toast('✅ Match saved', 'ok');
}

}

function buildMatchDraft(fixture, existingMatch){
  let maxLeg = fixture.legs || 1;
  if (existingMatch) {
    for(let i=4; i>=1; i--) {
      if (existingMatch['leg'+i+'ScoreA'] !== null && existingMatch['leg'+i+'ScoreA'] !== undefined) {
        maxLeg = Math.max(maxLeg, i); break;
      }
    }
  }
  const legs = maxLeg;
  const stats = {};
  const currentPlayers = app.state.players.filter(p => (p.teamId === fixture.teamAId || p.teamId === fixture.teamBId) && !p.freeAgent);
  currentPlayers.forEach(p => {
    stats[p.id] = [];
    for (let i = 0; i < 4; i++) stats[p.id].push({ played:false, goals:0, assists:0, saves:0, tackles:0 });
  });
  const playerTeams = existingMatch && existingMatch.playerTeams ? { ...existingMatch.playerTeams } : {};
  currentPlayers.forEach(p => { if (!playerTeams[p.id]) playerTeams[p.id] = p.teamId; });
  if (existingMatch && existingMatch.playerStats){
    Object.keys(existingMatch.playerStats).forEach(pid => {
      const p = playerById(pid);
      if (!p) return;
      if (!stats[pid]) stats[pid] = [{played:false,goals:0,assists:0,saves:0,tackles:0},{played:false,goals:0,assists:0,saves:0,tackles:0},{played:false,goals:0,assists:0,saves:0,tackles:0},{played:false,goals:0,assists:0,saves:0,tackles:0}];
      const src = existingMatch.playerStats[pid] || [];
      for (let i = 0; i < 4; i++){
        if (src[i]) stats[pid][i] = Object.assign({played:false,goals:0,assists:0,saves:0,tackles:0}, src[i]);
      }
      if (!playerTeams[pid] && p.teamId) playerTeams[pid] = p.teamId;
    });
  }
  const draft = {
    fixtureId: fixture.id,
    matchId: existingMatch ? existingMatch.id : null,
    leg: 1, legs,
    scores: [],
    mvpId: existingMatch ? existingMatch.mvpId : '',
    motmId: existingMatch ? existingMatch.motmId : '',
    stats, playerTeams, fouls: normalizeMatchFouls(existingMatch && existingMatch.fouls, fixture.teamAId, fixture.teamBId)
  };
  for (let i = 0; i < 4; i++){
    draft.scores.push({
      a: (existingMatch && existingMatch['leg'+(i+1)+'ScoreA'] !== null && existingMatch['leg'+(i+1)+'ScoreA'] !== undefined) ? existingMatch['leg'+(i+1)+'ScoreA'] : '',
      b: (existingMatch && existingMatch['leg'+(i+1)+'ScoreB'] !== null && existingMatch['leg'+(i+1)+'ScoreB'] !== undefined) ? existingMatch['leg'+(i+1)+'ScoreB'] : ''
    });
  }
  return draft;
}

document.addEventListener('click', async e => {
  if (e.target.classList && e.target.classList.contains('modal-back')){ closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  if (act === 'goto'){ go(el.dataset.view); return; }
  if (act === 'modal:close'){ closeModal(); return; }

  if (act === 'login'){
    openModal('🔐 Admin Login', `
      <div class="warnbox">Sign in with the password for the administrator account configured in Firebase. Readers can use anonymous Hype voting without providing names or email addresses.</div>
      <label class="fl">Admin password</label>
      <input id="localPass" type="password" autocomplete="current-password" placeholder="Enter admin password" autofocus>
      ${!dbClient ? '<div class="hint" style="margin-top:8px;color:#b45309">Firebase is not configured yet. Paste your Firebase Web App config into FIREBASE_CONFIG near the top of this file.</div>' : ''}

    if (!dbClient || !authClient) return toast('Firebase is not configured. Add your Firebase Web App config first.', 'err');
    try {
      const credential = await firebaseApi.signInWithEmailAndPassword(authClient, email, password);
      const user = credential.user;
      if (!user || !ADMIN_EMAILS.includes(String(user.email||'').toLowerCase()) || !ADMIN_UIDS.includes(String(user.uid||''))) {
        await firebaseApi.signOut(authClient);
        throw new Error('This Firebase account is not authorized to administer the league.');
      }
      app.isAdmin = true; app.user = { uid: user.uid };
      loadHypedPlayerIds();
      const foundCloudData = await loadCloudState();
      if (!foundCloudData && !hasPendingCloudSave()) await saveState();
      closeModal(); render(); toast('🔓 Admin signed in. Firebase database connected.', 'ok');
    } catch(err) {
      const code = String(err && err.code || '');
      const messages = {
        'auth/invalid-credential': 'Wrong admin password, or the Firebase user does not exist.',
        'auth/wrong-password': 'Wrong admin password.',
        'auth/user-not-found': 'The admin user was not found in Firebase Authentication.',
        'auth/too-many-requests': 'Too many attempts. Wait a little and try again.',

        'auth/operation-not-allowed': 'Email/Password sign-in is disabled. Enable it in Firebase Authentication → Sign-in method.',
        'auth/network-request-failed': 'Network error. Check your connection and try again.',

      !f.tournamentId && ((f.teamAId === a && f.teamBId === b) || (f.teamAId === b && f.teamBId === a)));

    roundRobinRounds(ids).forEach((pairs, r) => {
      pairs.forEach(([a, b], k) => {

function handleInput(e){
  const el = e.target.closest('[data-mfield]');
  if (!el) return;
  const d = app._draft;
  if (!d) return;
  const ds = el.dataset;
  if (ds.mfield === 'score') d.scores[Number(ds.leg)][ds.side] = el.value;
  else if (ds.mfield === 'played') d.stats[ds.pid][Number(ds.leg)].played = el.checked;
  else if (ds.mfield === 'stat') d.stats[ds.pid][Number(ds.leg)][ds.k] = Number(el.value) || 0;
  else if (ds.mfield === 'mvp') d.mvpId = el.value;
  else if (ds.mfield === 'motm') d.motmId = el.value;
  else if (ds.mfield === 'foul-desc') d.fouls[Number(ds.index)].description = el.value;
  else if (ds.mfield === 'foul-team') d.fouls[Number(ds.index)].teamId = el.value;
  else if (ds.mfield === 'foul-points') d.fouls[Number(ds.index)].points = Number(el.value) === 2 ? 2 : 1;
}

  const m = app._report && app._report.matches[parts[0]];
  const leg = m && m.legs[parts[1]];

  if (!p) return;
  const pid = sel.value;
  p.player = pid ? playerById(pid) : null;
  p.manual = !!pid;
  if (p.player){
    const norm = rpNorm(p.name);
    const known = [rpNorm(p.player.name)].concat((p.player.aliases || []).map(rpNorm));
    if (norm && known.indexOf(norm) === -1){
      p.player.aliases = (p.player.aliases || []).filter(a => rpNorm(a) !== norm).slice(-9).concat(p.name);
    }
    m.warnings = m.warnings.filter(w => w !== 'Unknown player: ' + p.name);

  if (!leg.given){ rpDeriveLeg(m, leg); rpDeriveAgg(m); }
  renderReportPreview(app._report);

function revertMatch(m){
  const E = econ();
  const agg = matchAggregate(m);
  const A = app.state.teams.find(t => t.id === m.teamAId);
  const B = app.state.teams.find(t => t.id === m.teamBId);
  if (!A || !B) return;
  if (agg.res === 'A'){
    if (E.enabled.win)  A.value -= E.win;
    if (E.enabled.loss) B.value -= E.loss;
  } else if (agg.res === 'B'){
    if (E.enabled.win)  B.value -= E.win;
    if (E.enabled.loss) A.value -= E.loss;
  } else {
    if (E.enabled.draw){ A.value -= E.draw; B.value -= E.draw; }
  }
}

async function saveMatch(){
  const d = app._draft;
  if (!d) return;
  const f = fixtureById(d.fixtureId);
  if (!f) return toast('❌ Fixture no longer exists', 'err');
  const isEdit = !!d.matchId;
  const ps = {};
  Object.keys(d.stats).forEach(pid => {
    const arr = d.stats[pid].slice(0, d.legs).map(l => ({
      played: !!l.played, goals: Number(l.goals) || 0, assists: Number(l.assists) || 0,
      saves: Number(l.saves) || 0, tackles: Number(l.tackles) || 0
    }));
    if (arr.some(l => l.played)) ps[pid] = arr;
  });
  const m = {
    id: d.matchId || uuid(),
    teamAId: f.teamAId, teamBId: f.teamBId, fixtureId: f.id,
    timestamp: Date.now(),
    mvpId: d.mvpId || null, motmId: d.motmId || null,
    mvpSnapshot: d.mvpId ? (() => { const p = playerById(d.mvpId); return p ? { name:p.name, teamId:p.teamId } : null; })() : null,
    motmSnapshot: d.motmId ? (() => { const p = playerById(d.motmId); return p ? { name:p.name, teamId:p.teamId } : null; })() : null,
    playerStats: ps, playerTeams: {}, fouls: normalizeMatchFouls(d.fouls, f.teamAId, f.teamBId)
  };
  Object.keys(ps).forEach(pid => {
    m.playerTeams[pid] = d.playerTeams[pid] || (playerById(pid)?.teamId) || null;
    if (!m.playerTeams[pid]) delete m.playerTeams[pid];
  });
  const isScored = val => val !== '' && val !== null && val !== undefined;
  for (let i = 1; i <= 4; i++){
    if (i <= d.legs && isScored(d.scores[i-1].a) && isScored(d.scores[i-1].b)){
      m['leg'+i+'ScoreA'] = Number(d.scores[i-1].a);
      m['leg'+i+'ScoreB'] = Number(d.scores[i-1].b);
    } else { m['leg'+i+'ScoreA'] = null; m['leg'+i+'ScoreB'] = null; }
  }
  if (isEdit){
    const old = matchById(d.matchId);
    if (old){
      revertLoanSettlements(old);
      revertMatch(old);
      app.state.matches = app.state.matches.filter(x => x.id !== old.id);
      m.timestamp = old.timestamp || Date.now();
      if (old.playerTeams){
        Object.keys(ps).forEach(pid => {
          if (!m.playerTeams[pid] && old.playerTeams[pid]) m.playerTeams[pid] = old.playerTeams[pid];
        });
      }
    }
  }
  applyMatchToState(m, f);
  if (isEdit && f.tournamentId) rebuildTournamentKO(f.tournamentId);
  await logAdmin(isEdit ? 'Edited match result' : 'Recorded match result');
  await saveState(); closeModal(); render();
  toast(isEdit ? '✅ Match updated' : '✅ Match recorded', 'ok');
}
